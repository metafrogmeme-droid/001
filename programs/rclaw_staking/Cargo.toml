[package]
name = "rclaw_staking"
version = "0.1.0"
description = "DRAFT/devnet $RCLAW staking program for the RUNECLAW tier gate"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "rclaw_staking"

[lints.rust]
# Anchor's #[program] macro emits `target_os = "solana"` checks so the on-chain
# entrypoint compiles only for the SBF target. A host rustc has never heard of
# that target_os and warns; declaring it here keeps `clippy -D warnings` usable
# as a CI gate without blanket-allowing the lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Declared because Anchor's #[program] macro expands to `cfg(feature = ...)`
# checks on them. Undeclared, every build emits `unexpected_cfg` warnings from
# macro-generated code, which makes `clippy -D warnings` unusable as a gate.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

[dev-dependencies]
solana-program-test = "1.18"
solana-sdk = "1.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.3", features = ["no-entrypoint"] }
