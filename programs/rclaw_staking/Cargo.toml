[package]
name = "rclaw_staking"
version = "0.1.0"
description = "DRAFT/devnet $RCLAW staking program for the RUNECLAW tier gate"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "rclaw_staking"

[lints.rust]
# Anchor's #[program] macro emits `target_os = "solana"` checks so the on-chain
# entrypoint compiles only for the SBF target. A host rustc has never heard of
# that target_os and warns; declaring it here keeps `clippy -D warnings` usable
# as a CI gate without blanket-allowing the lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Declared because Anchor's #[program] macro expands to `cfg(feature = ...)`
# checks on them. Undeclared, every build emits `unexpected_cfg` warnings from
# macro-generated code, which makes `clippy -D warnings` unusable as a gate.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.31.2", features = ["init-if-needed"] }
anchor-spl = "0.31.2"

# spl-token-2022 → solana-sdk pulls secp256r1's openssl into every host
# build. solana-client turns on `openssl-vendored` for `cargo test`; a plain
# `cargo build` does not, and then the build stops unless libssl-dev happens
# to be installed. Same feature, on the host only — the crate's own openssl
# dependency is already cfg'd out of the SBF target.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-secp256r1-program = { version = "=2.1.21", features = ["openssl-vendored"] }

[dev-dependencies]
# 2.1.21 is the newest Solana line whose solana-sdk depends on serde_with ^3
# and whose solana-streamer depends on quinn-proto ^0.11. Exact pins so a
# later 2.2/2.3 line (different crate split, older or newer proto) cannot
# drift back onto the vulnerable releases.
solana-program-test = "=2.1.21"
solana-sdk = "=2.1.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
spl-token = { version = "=7.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "=6.0.0", features = ["no-entrypoint"] }
# Floors, not the versions Cargo happened to pick. solana-sdk 2.1 allows
# serde_with ^3.11 and solana-streamer allows quinn-proto ^0.11.9, both of
# which still include the vulnerable releases. These keep a later
# `cargo update` from walking back under the patched versions.
serde_with = "3.21"
quinn-proto = "0.11.15"
