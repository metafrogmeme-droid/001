# =============================================================================
# RUNECLAW nginx config
# File: nginx.conf  (repo root — mounted into the nginx container)
#
# This is a TEMPLATE, and it is mounted at /etc/nginx/templates/ so the
# nginx:1.27-alpine entrypoint runs envsubst over it at container start. Set
# RUNECLAW_DOMAIN in .env; every ${RUNECLAW_DOMAIN} below is substituted before
# nginx ever parses the file.
#
# It used to say YOUR_DOMAIN in five places — server_name, both certificate
# paths and the CORS origin — while docker-compose mounted it DIRECTLY as
# conf.d/default.conf. nginx cannot start with a certificate path that does not
# exist, so the documented stack could not come up at all, and the CORS origin
# could never match. "Replace YOUR_DOMAIN" in a comment is an instruction that
# nothing enforces; envsubst is the same instruction, enforced.
#
# TLS certs from Let's Encrypt (certbot), run once on the host before starting:
#   sudo certbot certonly --standalone -d "$RUNECLAW_DOMAIN"
# =============================================================================

# WebSocket upgrade, mapped rather than hardcoded.
#
# `proxy_set_header Connection "upgrade"` was previously set unconditionally on
# /api/, so every ordinary request also announced an upgrade it was not making.
# This map sends "upgrade" only when the client actually asked for one and
# "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP request budget, enforced HERE rather than in the app.
#
# api_bridge.py:105-110 says outright that its in-process limiter is
# best-effort and that "rate limiting should move to the reverse proxy or a
# shared store ... so a single budget is enforced across all workers". The
# reverse proxy existed and did not do it.
limit_req_zone $binary_remote_addr zone=rc_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=rc_gateway:10m rate=60r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name ${RUNECLAW_DOMAIN};

    # certbot's webroot renewal must not be redirected away.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${RUNECLAW_DOMAIN};

    # TLS
    ssl_certificate     /etc/letsencrypt/live/${RUNECLAW_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${RUNECLAW_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Mozilla "intermediate" — forward secrecy and AEAD only. The previous
    # `HIGH:!aNULL:!MD5` still permitted CBC and SHA1 suites.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers live in snippets/security-headers.conf and are INCLUDED
    # at each location below rather than declared here. See that file: a
    # location that sets any add_header of its own inherits none of the
    # server-level ones, and every location here sets one.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Gateway landing page (legacy dashboards retired — the product's
    #    one face is the app/ web platform) ────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Serve static assets with long cache
    location ~* \.(js|css|png|ico|woff2?)$ {
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # ── API Bridge proxy ────────────────────────────────────────────────────
    # All /api/* routes proxy to FastAPI on api_bridge:8000
    # The dashboard calls these with Authorization: Bearer $DASHBOARD_TOKEN
    location /api/ {
        # Strip /api prefix before forwarding
        rewrite ^/api/(.*) /$1 break;

        # burst absorbs a dashboard's opening fan-out; nodelay serves the burst
        # immediately rather than queueing it behind the 30r/m drip.
        limit_req zone=rc_api burst=20 nodelay;

        proxy_pass         http://api_bridge:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # Timeouts: scan can take up to 90s for 67 symbols
        proxy_read_timeout  120s;
        proxy_send_timeout  30s;
        proxy_connect_timeout 10s;

        include /etc/nginx/snippets/security-headers.conf;

        # CORS for dashboard origin
        add_header Access-Control-Allow-Origin  "https://${RUNECLAW_DOMAIN}" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"   always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Direct /health shortcut (no /api prefix needed for smoke tests)
    location = /health {
        proxy_pass http://api_bridge:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Web user gateway (chat + manual trades) ─────────────────────────────
    # Proxies to the bot process's aiohttp server (:8080, /gateway/*) so a
    # REMOTELY-hosted website (app/ Express, BOT_GATEWAY_URL=https://$RUNECLAW_DOMAIN)
    # can reach it over TLS. Safe to expose: the gateway is fail-closed behind
    # the X-Gateway-Secret header (WEB_GATEWAY_SECRET, >=32 chars) and browsers
    # never call it directly — only the Express server does.
    location /gateway/ {
        limit_req zone=rc_gateway burst=30 nodelay;

        proxy_pass         http://runeclaw-bot:8080/gateway/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # LLM chat replies can take a while
        proxy_read_timeout  60s;
        proxy_send_timeout  30s;
        proxy_connect_timeout 10s;

        include /etc/nginx/snippets/security-headers.conf;
    }

    # Block .env and hidden files.
    #
    # Declared BEFORE the static-asset regex above would be wrong, and after it
    # is what the old file did — but regex locations are matched in source
    # order, so a request for `/.env.js` hit the asset rule first. `^~` on a
    # prefix location beats every regex regardless of order.
    location ^~ /. {
        deny all;
        return 404;
    }

    # Gzip. Deliberately NOT application/json: these responses carry
    # authenticated data, and compressing a secret alongside attacker-chosen
    # input is the BREACH precondition.
    gzip on;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 1024;
}
