    kind: perpetual
    raw_symbol: BNBUSDT
    base_currency: BNB
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 2
    size_precision: 2
    price_increment: "0.01"
    size_increment: "0.01"
    lot_size: "0.01"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
