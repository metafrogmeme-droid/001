venue:
  name: BITGET
  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 10000
      currency: USDT

strategy:
  module: strategy
  class: RuneclawConfluenceStrategy
  config_class: RuneclawConfluenceStrategyConfig
  config:
    order_id_tag: "001"
    leverage: 10
    margin_budget: "100"
    max_loss_usdt: "15"
    min_score: 70
    allow_short: true
    max_concurrent: 3
    sl_min_pct: "1.2"
    atr_limit_mult: "0.5"
    tp1_pct: "3.5"
    mr_stretch_atr: "1.5"
    mr_stop_atr: "1.2"
    bo_vol_ratio: "2.5"
    bo_stop_atr: "1.0"
    bo_tp_atr: "2.0"
    breakeven_pct: "2.0"
    momentum_ttl_bars: 16
    momentum_time_stop_bars: 32
    mr_ttl_bars: 3
    mr_time_stop_bars: 8
    bo_ttl_bars: 2
    bo_time_stop_bars: 6
    circuit_pause_usdt: "30"
    circuit_stop_usdt: "40"
    circuit_pause_bars: 24
    min_notional_usdt: "5"

