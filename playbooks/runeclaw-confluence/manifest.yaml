long_description: |
  RUNECLAW Confluence is a regime-adaptive system on major USDT perpetual
  futures that aims to capture whatever behavior the market is actually
  offering rather than forcing one style onto every session. It reads the
  market leader's backdrop first and routes every name in its universe to a
  matching playstyle: riding momentum pullbacks when the backdrop trends,
  fading stretched moves back toward the session's average traded price when
  it ranges, and an opportunistic breakout overlay when unusual volume
  arrives. Flat is the default state — when the backdrop is mixed or
  unreadable the strategy opens nothing and waits.

  Entries are gated per symbol by a blended confluence reading built from
  independent technical voters: trend alignment across timeframes, momentum
  oscillators, position against the session's average traded price, location
  within the recent range, volume behavior, and volatility bands. Only when
  the electorate agrees strongly enough does a name act — entering long with
  a constructive leader, short against a weak one, usually on a resting limit
  order placed where a normal retracement should fill rather than chasing.

  Exits are risk-first. A protective stop rests at the venue from the moment
  a position opens, and every position is sized backward from a fixed
  worst-case dollar loss so a single trade cannot take more than its
  allowance. Profit is taken at a defined target, the stop lifts toward the
  entry once a trade has moved favourably, stale unfilled entries expire on
  their own, positions carry an intraday time stop, a portfolio cap limits
  how many names may hold positions at once, and a daily circuit breaker
  first pauses and then stops trading entirely after a losing day.

  Subscribers can tune the traded universe, the leverage applied, the margin
  budget that anchors sizing and the displayed return, the dollar risk
  allowed per trade, the confluence bar required to act, whether short
  entries are allowed, and how many positions may run concurrently. Higher
  leverage or a larger risk allowance enlarges gains and drawdowns alike; a
  higher confluence bar trades less often but more selectively; widening the
  universe spreads attention across more names but increases data load.

  The strategy underperforms when the leader chops without committing to a
  direction, when a quiet range resolves into a sudden trend against a
  reversion entry, or when fast moves gap through protective stops. By design
  it can sit idle for long stretches. Historical results come from replaying
  real bars with fees applied, but past performance is not a promise: live
  trading pays slippage that erodes edge, so size every position to a
  drawdown you can tolerate.
market_type: contract
trading_symbols: ["BNBUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "LINKUSDT", "AVAXUSDT", "SUIUSDT", "BCHUSDT", "NEARUSDT", "AAVEUSDT", "BTCUSDT"]
tags: ["confluence", "regime-adaptive", "momentum", "mean-reversion", "breakout", "multi-timeframe", "multi-asset", "risk-managed", "contract", "runeclaw"]

schedule:
  cron: "*/15 * * * *"
  tz: "Asia/Shanghai"

decision_mode: deterministic
backtest_support: full
runtime_profile: deterministic
execution_mode: follow_trade
follow_trade_supported: true

strategy_config:
  trading_symbols: ["BNBUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "LINKUSDT", "AVAXUSDT", "SUIUSDT", "BCHUSDT", "NEARUSDT", "AAVEUSDT", "BTCUSDT"]
  leverage: 10
  margin_budget: "100"
  max_loss_usdt: "15"
  min_score: 70
  allow_short: true
  max_concurrent: 3
  max_scan_symbols: 12
  interval: "15m"
  backtest_days: 30
  max_backtest_symbols: 5
  backtest_batch_size: 4
  data_exchange: "bitget"
  sl_min_pct: "1.2"
  atr_limit_mult: "0.5"
  tp1_pct: "3.5"
  mr_stretch_atr: "1.5"
  mr_stop_atr: "1.2"
  bo_vol_ratio: "2.5"
  bo_stop_atr: "1.0"
  bo_tp_atr: "2.0"
  breakeven_pct: "2.0"
  momentum_ttl_bars: 16
  momentum_time_stop_bars: 32
  mr_ttl_bars: 3
  mr_time_stop_bars: 8
  bo_ttl_bars: 2
  bo_time_stop_bars: 6
  circuit_pause_usdt: "30"
  circuit_stop_usdt: "40"
  circuit_pause_bars: 24
  min_notional_usdt: "5"

user_config_schema:
  trading_symbols:
    type: array
    item_type: string
    default: ["BNBUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "LINKUSDT", "AVAXUSDT", "SUIUSDT", "BCHUSDT", "NEARUSDT", "AAVEUSDT", "BTCUSDT"]
    options: ["BNBUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "LINKUSDT", "AVAXUSDT", "SUIUSDT", "BCHUSDT", "NEARUSDT", "AAVEUSDT", "LTCUSDT", "DOTUSDT", "XLMUSDT", "BTCUSDT"]
    min_items: 2
    max_items: 16
    label: "Traded universe (keep BTCUSDT in the list: it is the regime leader and is never traded)"
  leverage:
    type: integer
    default: 10
    min: 1
    max: 25
    aliases:
      10x: 10
      20x: 20
    label: "Leverage"
  margin_budget:
    type: string
    default: "100"
    pattern: '^[0-9]+(\.[0-9]+)?$'
    label: "Margin budget USDT (sizing + return % denominator)"
  max_loss_usdt:
    type: string
    default: "15"
    pattern: '^[0-9]+(\.[0-9]+)?$'
    label: "Max loss per trade USDT (drives position size from the stop)"
  min_score:
    type: integer
    default: 70
    min: 50
    max: 95
    label: "Confluence score required to enter"
  allow_short:
    type: boolean
    default: true
    label: "Enable short-side setups"
  max_concurrent:
    type: integer
    default: 3
    min: 1
    max: 5
    label: "Max concurrent open positions across the universe"
  max_backtest_symbols:
    type: integer
    default: 5
    min: 1
    max: 12
    label: "Symbols replayed in the official backtest slice"
  backtest_days:
    type: integer
    default: 30
    min: 7
    max: 60
    label: "Backtest window in days"
