# RUNECLAW Risk Manifest v1.1
# The documented statement of each pre-trade check: what it measures, the
# figure it compares against, and what it does when it cannot measure.
#
# NOTHING LOADS THIS FILE AT RUNTIME. The risk engine reads its figures from
# bot/config.py (RiskLimits, StrategyTypeConfig) and bot/core/order_flow.py
# (OrderFlowConfig), and from constants in the modules named below; no docs
# page renders from it either. It restates the code, and tests hold it there:
#   tests/test_manifest_and_whynot.py
#     - `defaults:` against bot/config.py::RiskLimits, field by field;
#     - every per-check `threshold:` figure: a key that names a config field
#       (RiskLimits, StrategyTypeConfig, OrderFlowConfig) is compared with that
#       field's code default, and every other key is listed in the test with
#       the code it was read from and checked against it.
#   tests/test_risk_page_does_not_overclaim_fail_closed.py
#     - the fail_behavior tally the public pages print.
# A figure here that disagrees with the code fails a test. Change the code
# first, then this file.
#
# Source files:
#   bot/risk/risk_engine.py  — RiskEngine._evaluate_locked: every check below
#                              except #17
#   bot/core/engine.py       — #17 LIQUIDITY (RuneClawEngine._analyze_signal)
#   bot/core/order_flow.py   — OrderFlowConfig, OrderFlowAnalyzer.liquidity_guard
#   bot/core/macro_events.py — #18 MacroEventProvider
#   bot/config.py            — RiskLimits, StrategyTypeConfig, env bindings

version: "1.1"
updated: "2026-10-15"

# =============================================================================
# PRE-TRADE CHECKS (the ones listed here)
# =============================================================================
# The contract, as the code keeps it: RiskEngine._evaluate_locked collects
# every check it runs and APPROVES only when none failed
# (`verdict = APPROVED if len(failed) == 0`). One failure rejects the trade.
# What that does not mean:
#   * Not every check runs on every trade. A manual /trade (idea.source
#     "manual") skips #6 RISK_REWARD and #7 CONFIDENCE, and the opt-in
#     FEE_AWARE and REENTRY_COOLDOWN gates. #17 LIQUIDITY runs only on the
#     analyzer's path. #20 CONCENTRATION_PCA is not evaluated in live mode.
#     An engine built with no macro provider (the backtest's) skips #18.
#   * A figure can move at runtime: /drawdownlimit sets the live drawdown cap
#     (#4) anywhere from 1% to 30%.
#   * Live, #8, #14, #15 and #21 read the executor's book the trade joins.
#     With LIVE_BOOK_RISK_GATES_ENABLED off (it is on by default) their live
#     refusals are reported on the check line and not enforced.
#   * This list is not every gate. The engine also runs gates it does not
#     list: WARNING_RATE_BREAKER, MARGIN_RISK, STOP_DISTANCE and SLTP_SIDES
#     (each rejects when it cannot evaluate), the live-performance governor
#     and the opt-in equity-curve and drawdown-recovery pauses, and gates that
#     PASS when they cannot evaluate (RC-AUD-011): the order-flow gates
#     TAKER_3BAR and BID_DOMINANCE (no order-flow analyzer, or no fresh signal
#     for the symbol), FUNDING_CLOCK (no funding data for the symbol, or an
#     error), and the opt-in FEE_AWARE, REENTRY_COOLDOWN, INTENT_POLICY,
#     VALIDATION and AUTHORITY hooks (an error leaves the trade untouched).
# Fail behavior, for the checks listed here:
#   "closed" = if the check cannot be evaluated, the trade is REJECTED.
#   "open"   = if the check cannot be evaluated, the trade is allowed through.
#   "skip"   = check is gracefully skipped when data is unavailable (returns pass).
# `env_var` names the settings that move a check's figures; a list when there
# are several.

checks:
  - id: 1
    name: CIRCUIT_BREAKER
    description: >
      Rejects every entry while the breaker is open. Tripped by a daily-loss
      breach (#3), a drawdown breach (#4), a consecutive-loss streak reaching
      max_consecutive_losses (counted when a trade closes, not in this check),
      or by hand (/pause, /halt). Persisted to disk; survives restarts.
      How it clears depends on what tripped it. A daily-loss trip resets
      itself on the first evaluation after the UTC day rolls over
      (daily_loss_breaker_autoreset_enabled, on by default), unless the loss
      streak is itself at max_consecutive_losses. A streak trip clears itself
      streak_breaker_autoreset_hours after the last loss (0, the default, is
      off). A drawdown or manual trip clears only by hand.
    fail_behavior: closed
    threshold:
      daily_loss_breaker_autoreset_enabled: true
      streak_breaker_autoreset_hours: 0.0
    env_var: [DAILY_LOSS_BREAKER_AUTORESET, STREAK_BREAKER_AUTORESET_HOURS]
    trips_circuit_breaker: false
    notes: "Manual reset: /reset or /resume (RiskEngine.reset_circuit_breaker)."

  - id: 2
    name: POSITION_SIZE
    description: >
      Caps the MARGIN committed per trade as a percentage of equity (the
      executor places margin x leverage as notional). The size starts
      fixed-fractional: the strategy type's risk budget
      (StrategyTypeConfig.*_max_risk_pct) divided by stop distance x the
      sized leverage. Reductions (regime, session, governor and others) apply,
      and the result is clamped to the cap. The cap is per strategy type while
      per_strategy_notional_cap_enabled is on (the default): scalp 8%,
      intraday 10%, swing 13%, position 15%. With the flag off, or for a
      strategy type with no figure of its own, it is max_position_pct (13%).
      The volatility target and the regime, equity-throttle, risk-preference
      and quality-ladder reductions can lower the figure the size is clamped
      to; none raises it.
    fail_behavior: closed
    threshold:
      per_strategy_notional_cap_enabled: true
      scalp_max_position_pct: 8.0
      intraday_max_position_pct: 10.0
      swing_max_position_pct: 13.0
      position_max_position_pct: 15.0
      max_position_pct: 13.0  # flag off, or a strategy type with no figure
    env_var: [PER_STRATEGY_NOTIONAL_CAP_ENABLED, SCALP_MAX_POSITION_PCT,
              INTRADAY_MAX_POSITION_PCT, SWING_MAX_POSITION_PCT,
              POSITION_MAX_POSITION_PCT, MAX_POSITION_PCT]
    trips_circuit_breaker: false
    notes: >
      An oversized size is clamped to the cap before this check runs, so in
      normal operation the check passes and the size trace names the clamp.
      It rejects on zero or negative equity, and on a size still above the cap
      (a clamp that was bypassed). It is the per-TRADE cap; the per-symbol
      aggregate is #15.

  - id: 3
    name: DAILY_LOSS
    description: >
      Rejects, and trips the circuit breaker, when the day's loss reaches
      max_daily_loss_pct of equity AND is at least daily_loss_breaker_min_usd
      in dollars (0, the default, leaves the percentage alone). Paper: the
      tracker's daily PnL, realized plus unrealized, over equity. Live: the
      realized PnL of today's UTC day over live equity. Across a person's
      venues the larger of this book's and the person's loss is used, and a
      cross-venue reading that is incomplete rejects.
    fail_behavior: closed
    threshold:
      max_daily_loss_pct: 5.0
      daily_loss_breaker_min_usd: 0.0
    env_var: [MAX_DAILY_LOSS_PCT, DAILY_LOSS_BREAKER_MIN_USD]
    trips_circuit_breaker: true
    notes: "Trips circuit breaker on breach."

  - id: 4
    name: DRAWDOWN
    description: >
      Rejects, and trips the circuit breaker, when the CURRENT drawdown from
      the equity high-water mark reaches the cap. Paper: max_drawdown_pct
      (10%). Live, while live risk hardening is on (live_risk_hardening_enabled,
      the default): live_max_drawdown_pct (7%), measured from the live
      account's own high-water mark, which is not kept across a restart unless
      PERSIST_LIVE_DRAWDOWN_PEAK is on. The operator can move the live cap
      anywhere from 1% to 30% at runtime (/drawdownlimit). Across a person's
      venues the larger of this book's and the person's drawdown is used, and
      a cross-venue reading that is incomplete rejects.
    fail_behavior: closed
    threshold:
      max_drawdown_pct: 10.0
      live_risk_hardening_enabled: true
      live_max_drawdown_pct: 7.0
      live_override_min_pct: 1.0   # /drawdownlimit floor
      live_override_max_pct: 30.0  # /drawdownlimit ceiling
    env_var: [MAX_DRAWDOWN_PCT, LIVE_RISK_HARDENING_ENABLED, LIVE_MAX_DRAWDOWN_PCT]
    trips_circuit_breaker: true
    notes: "Trips circuit breaker on breach."

  - id: 5
    name: OPEN_POSITIONS
    description: >
      Limits the number of concurrently open positions. Live: the exchange's
      open positions plus orders pending a fill. Across a person's venues the
      larger of this book's count and the person's is used, and a count that
      misses a venue rejects even under the cap (it is only a floor).
    fail_behavior: closed
    threshold:
      max_open_positions: 5
    env_var: MAX_OPEN_POSITIONS
    trips_circuit_breaker: false

  - id: 6
    name: RISK_REWARD
    description: >
      Requires the idea's reward:risk (|TP - entry| / |entry - SL|, rounded to
      two places) to reach the minimum for its strategy type
      (StrategyTypeConfig.get_min_rr): scalp 1.2, intraday 1.5, swing 1.5,
      position 2.0, and 1.5 for a type with no figure of its own. A 0.01
      tolerance absorbs float rounding at the boundary. Skipped for a manual
      trade. RiskLimits.min_risk_reward (MIN_RISK_REWARD) is NOT read by this
      check.
    fail_behavior: closed
    threshold:
      scalp_min_rr: 1.2
      intraday_min_rr: 1.5
      swing_min_rr: 1.5
      position_min_rr: 2.0
      unmapped_strategy_min_rr: 1.5
      boundary_tolerance: 0.01
    env_var: [SCALP_MIN_RR, INTRADAY_MIN_RR, SWING_MIN_RR, POSITION_MIN_RR]
    trips_circuit_breaker: false

  - id: 7
    name: CONFIDENCE
    description: >
      Requires the analyzer's confidence to reach min_confidence, on the raw
      scale: with calibration on, the comparison reads the pre-calibration
      blend, not the calibrated figure on the idea. With
      per_strategy_confidence_floor_enabled (off by default) the floor is the
      strategy type's StrategyTypeConfig.*_min_confidence instead. A
      confidence that cannot be read fails. Skipped for a manual trade, whose
      confidence is a stamp rather than a measurement. 0.60 was chosen on the
      frozen benchmark (docs/FROZEN_BENCHMARK.md).
    fail_behavior: closed
    threshold:
      min_confidence: 0.60
      per_strategy_confidence_floor_enabled: false
    env_var: [MIN_CONFIDENCE, PER_STRATEGY_CONFIDENCE_FLOOR_ENABLED]
    trips_circuit_breaker: false

  - id: 8
    name: CORRELATION
    description: >
      Caps concurrent positions in one correlation group: rejects when the
      group already holds max_correlation_per_group positions. Symbols not in
      the correlation map pool into ONE shared bucket (UNMAPPED_ALT) capped at
      max_unmapped_correlated, and so does every perp id (BASE/USDT:USDT)
      while correlation_perp_group_mapping_enabled is off (the default),
      because the suffix is then not stripped before the lookup. On the paper
      book a same-direction position whose recent returns correlate above
      max_correlation with an open one is also rejected (CORRELATION_V2; not
      run on the live book). Live: the counts read the executor's book, open
      and resting. Binds manual trades too.
    fail_behavior: closed
    threshold:
      max_correlation_per_group: 2
      max_unmapped_correlated: 3
      correlation_perp_group_mapping_enabled: false
      max_correlation: 0.85
    env_var: [MAX_CORRELATION_PER_GROUP, MAX_UNMAPPED_CORRELATED,
              CORRELATION_PERP_GROUP_MAPPING_ENABLED, MAX_CORRELATION]
    trips_circuit_breaker: false
    notes: "See correlation_groups section below for full mapping."

  - id: 9
    name: LOSS_STREAK
    description: >
      Soft reject once the account-wide losing streak reaches soft_reject_at
      (RiskEngine._soft_loss_streak_limit: max_consecutive_losses - 2, at
      least 2 and always below the hard limit). The hard stop is the circuit
      breaker (#1), tripped when a close takes the streak to
      max_consecutive_losses. A winning close takes one off the streak and a
      break-even close leaves it, so with trading blocked the soft gate would
      latch for good. The way out: once loss_streak_probe_hours have passed
      since the last loss, ONE probe trade is allowed at a time, and only
      while no position is open. A losing probe re-arms the gate; a winning
      probe decays the streak. An unknown last-loss time allows no probe.
      Binds manual trades too.
    fail_behavior: closed
    threshold:
      soft_reject_at: 3
      max_consecutive_losses: 5
      loss_streak_probe_hours: 24.0  # 0 = the legacy permanent latch
    env_var: [MAX_CONSECUTIVE_LOSSES, LOSS_STREAK_PROBE_HOURS]
    trips_circuit_breaker: false
    notes: "Soft reject derives from the hard limit. Probe cool-off via LOSS_STREAK_PROBE_HOURS."

  - id: 10
    name: ENTRY_PRICE
    description: >
      Validates that the entry price is finite and above zero (NaN and
      infinity are rejected).
    fail_behavior: closed
    threshold: null
    env_var: null
    trips_circuit_breaker: false

  - id: 11
    name: STOP_LOSS
    description: >
      Requires a valid stop-loss on every trade idea: finite, above zero, and
      not equal to the entry price. REQUIRE_STOP_LOSS=false turns the
      requirement off; the check then passes and says so. Which side of the
      entry the stop sits on is checked separately (SLTP_SIDES, not listed
      here).
    fail_behavior: closed
    threshold:
      require_stop_loss: true
    env_var: REQUIRE_STOP_LOSS
    trips_circuit_breaker: false
    notes: "Default: required (true)."

  - id: 12
    name: STALE_DATA
    description: >
      Rejects a trade idea older than stale_data_max_age_seconds, measured
      from the idea's timestamp to now. An idea placed as a limit order gets
      limit_order_age_multiplier times that. An idea timestamped more than
      future_skew_tolerance_seconds in the future is rejected too.
    fail_behavior: closed
    threshold:
      stale_data_max_age_seconds: 300
      limit_order_age_multiplier: 2
      future_skew_tolerance_seconds: 30
    env_var: STALE_DATA_MAX_AGE_SEC
    trips_circuit_breaker: false

  - id: 13
    name: COOLDOWN
    description: >
      Rejects new entries until cooldown_after_loss_seconds have passed since
      the most recent losing close, or since a close whose P&L could not be
      read. Binds manual trades too. Under backtest replay the clock is the
      simulated bar time.
    fail_behavior: closed
    threshold:
      cooldown_after_loss_seconds: 120
    env_var: COOLDOWN_AFTER_LOSS_SEC
    trips_circuit_breaker: false

  - id: 14
    name: PORTFOLIO_EXPOSURE
    description: >
      Limits total portfolio exposure as a percentage of equity: the margin
      committed by every open position plus the new position's margin. Paper:
      open positions marked to market. Live: committed margin on the
      executor's book, with no unrealized P&L; a held position whose margin
      was never read rejects.
    fail_behavior: closed
    threshold:
      max_portfolio_exposure_pct: 80.0
    env_var: MAX_PORTFOLIO_EXPOSURE_PCT
    trips_circuit_breaker: false

  - id: 15
    name: SYMBOL_EXPOSURE
    description: >
      Limits per-symbol exposure as a percentage of equity: the margin already
      committed on the symbol plus the new position's margin. Paper: marked
      to market. Live: committed margin on the executor's book, with no
      unrealized P&L; a held position whose margin was never read rejects.
    fail_behavior: closed
    threshold:
      max_symbol_exposure_pct: 20.0
    env_var: MAX_SYMBOL_EXPOSURE_PCT
    trips_circuit_breaker: false

  - id: 16
    name: VOLATILITY
    description: >
      Rejects trades when ATR exceeds volatility_guard_atr_pct of the entry
      price. Fail-closed: ATR data must be present and > 0. A symbol in the
      MEME correlation group gets a WIDER threshold,
      max(volatility_guard_atr_pct, meme_coin_threshold_floor_pct), which is
      10% at the defaults. The group is looked up by the symbol as written
      (BASE/USDT, or a bare BASE), so a perp id such as DOGE/USDT:USDT is not
      matched and takes the ordinary threshold.
    fail_behavior: closed
    threshold:
      volatility_guard_atr_pct: 7.0
      meme_coin_threshold_floor_pct: 10.0  # a literal in the engine
    env_var: VOLATILITY_GUARD_ATR_PCT
    trips_circuit_breaker: false
    notes: >
      BTC hourly ATR is typically 1-4%. 7% allows elevated-vol periods
      while blocking extreme conditions.

  - id: 17
    name: LIQUIDITY
    description: >
      Liquidity guard: OrderFlowAnalyzer.liquidity_guard (bot/core/order_flow.py),
      called from RuneClawEngine._analyze_signal after the risk engine has
      sized the idea. Rejects a spread above max_spread_bps, or a thinner book
      side (summed over book_depth_levels levels) below
      max(depth_position_multiple x the sized position, min_top_depth_usd).
      For BTC, ETH and SOL (spot or perp ids) that floor is raised to
      large_cap_depth_floor_usd. With guard_top_depth_enabled (on by default)
      the best book_top_levels levels on each side must also cover the
      position. This is the ONLY fail-open check the manifest lists: no data =
      pass. No order-flow signal for the symbol, or a book that did not
      resolve, lets the trade through. The engine's order-flow gates
      TAKER_3BAR and BID_DOMINANCE and its FUNDING_CLOCK gate, which this file
      does not list, also pass without data (see the header).
    fail_behavior: open
    threshold:
      max_spread_bps: 50.0
      book_depth_levels: 25
      depth_position_multiple: 10  # a literal in liquidity_guard
      min_top_depth_usd: 2000.0
      large_cap_depth_floor_usd: 10000.0
      guard_top_depth_enabled: true
      book_top_levels: 5
    env_var: [OF_MAX_SPREAD_BPS, OF_BOOK_DEPTH, OF_MIN_DEPTH_USD,
              OF_LARGE_CAP_DEPTH_FLOOR_USD, OF_GUARD_TOP_DEPTH_ENABLED,
              OF_BOOK_TOP_LEVELS]
    trips_circuit_breaker: false
    notes: >
      Runs in engine.py, not in risk_engine.py. The sized position it is
      handed is the risk engine's position_size_usd, which is MARGIN.
      MIN_BOOK_DEPTH_USD (RiskLimits.min_book_depth_usd) is a dead knob:
      nothing reads it, and setting it changes nothing here.

  - id: 18
    name: MACRO_EVENT
    description: >
      Asks the macro-event provider (bot/core/macro_events.py::MacroEventProvider,
      which the bot wires into the operator's engine and every per-user
      engine, reading config/macro_calendar.seed.json) for the state now.
      BLOCK_NEW_ENTRIES rejects. REDUCE passes; its size multiplier was
      already applied to the size before the cap. The windows depend on the
      event's severity. CRITICAL (FOMC_DECISION) blocks from 60 minutes before
      to 30 after, and reduces size from 180 minutes before. HIGH (CPI, NFP)
      blocks from 30 before to 15 after, and reduces from 120 before. MEDIUM
      (CORE_PCE, ISM_PMI, PPI, GDP, RETAIL_SALES) blocks from 15 before to 10
      after. After a CRITICAL, HIGH or MEDIUM block ends, size stays reduced
      for 30 more minutes. A LOW event (any other kind) blocks only at its
      scheduled instant. A funding rate on the symbol of +0.10% per 8 h or
      more blocks as a synthetic CRITICAL event. A calendar that could not be
      loaded (blind), or a seed file that, when loaded, is older than 72 h and
      has no event beyond the next 72 h (stale), blocks new entries unless
      MACRO_FAILSAFE=false; a
      provider that raises blocks too. An engine built with no provider (the
      backtest's) skips the check and passes; the v1 MacroCalendar
      (EVENT_LOCKDOWN and BLACKOUT reject) is consulted only by an engine
      given a calendar and no provider.
    fail_behavior: closed
    threshold:
      critical_block_before_min: 60
      critical_block_after_min: 30
      critical_reduce_before_min: 180
      high_block_before_min: 30
      high_block_after_min: 15
      high_reduce_before_min: 120
      medium_block_before_min: 15
      medium_block_after_min: 10
      post_event_reduce_min: 30
      reduce_size_multiplier: 0.5
      funding_block_rate_per_8h: 0.001
      calendar_stale_after_hours: 72
    env_var: MACRO_FAILSAFE
    trips_circuit_breaker: false
    notes: >
      Provider: BLOCK_NEW_ENTRIES = reject, REDUCE = pass with the size
      multiplier. v1 calendar: EVENT_LOCKDOWN = reject, BLACKOUT = reject
      (fail-closed).

  - id: 19
    name: MTF_ALIGNMENT
    description: >
      Rejects a counter-trend entry: a LONG when the idea's higher-timeframe
      trend (idea.htf_trend) is bearish, a SHORT when it is bullish. The
      analyzer sets htf_trend from the daily timeframe's EMA20/EMA50 trend
      (4h when there are no daily candles; bot/core/multi_timeframe.py). A
      neutral or missing trend has no opinion and the check passes. With
      htf_trend unset, legacy "MTF:<tf>=UP|DOWN" tags in idea.signals_used are
      read instead once there are at least legacy_min_mtf_tags of them, by
      simple majority. With MTF_ALIGNMENT_GATE_ENABLED off it always passes.
    fail_behavior: skip
    threshold:
      mtf_alignment_gate_enabled: true
      legacy_min_mtf_tags: 2
    env_var: MTF_ALIGNMENT_GATE_ENABLED
    trips_circuit_breaker: false
    notes: "Passes (no opinion) when the higher-timeframe trend is neutral or absent."

  - id: 20
    name: CONCENTRATION_PCA
    description: >
      Portfolio concentration check using PCA on the correlation matrix of
      returns. Rejects when the first principal component explains more than
      pc1_max_explained_variance of the variance. Needs at least two open
      positions. Reads aligned price returns for the assets held
      (var_covariance_min_points each); without them it falls back to
      closed-trade returns (min_trade_history closed trades, two assets with
      min_return_periods closes each) and says so on the check line, because
      that matrix is about what the book used to hold. Not evaluated in live
      mode; the check line says so.
    fail_behavior: skip
    threshold:
      pc1_max_explained_variance: 0.70
      min_assets_required: 2
      min_return_periods: 3
      min_trade_history: 5
      var_covariance_min_points: 20
    env_var: VAR_COVARIANCE_MIN_POINTS
    trips_circuit_breaker: false
    notes: "Gracefully skipped when insufficient positions or trade history."

  - id: 21
    name: PORTFOLIO_VAR
    description: >
      Parametric Value at Risk at confidence_level (z_score, one-day holding
      period). Rejects when the book plus the proposed position (its margin x
      the sized leverage, as notional) would carry a VaR above
      max_portfolio_var_pct of equity. Volatility comes from per-trade
      returns of closed trades, a proxy that ignores cross-asset correlation,
      or from a covariance matrix of the held assets' price returns when
      var_covariance_enabled is on or live risk hardening is active and every
      asset has var_covariance_min_points of history. Skipped (passes) with
      fewer than min_trades_required closed trades and no covariance answer.
      Live: measured on the executor's book; a held position whose notional
      or side was never read rejects.
    fail_behavior: skip
    threshold:
      confidence_level: 0.95
      z_score: 1.645
      max_portfolio_var_pct: 15.0
      min_trades_required: 5
      var_covariance_enabled: false
      var_covariance_min_points: 20
    env_var: [MAX_PORTFOLIO_VAR_PCT, VAR_COVARIANCE_ENABLED, VAR_COVARIANCE_MIN_POINTS]
    trips_circuit_breaker: false
    notes: "Gracefully skipped when fewer than 5 closed trades (insufficient history)."

# =============================================================================
# CONFIGURABLE DEFAULTS (RiskLimits dataclass)
# =============================================================================
# All values from bot/config.py RiskLimits with their env vars and defaults.

defaults:
  max_position_pct:
    value: 13.0
    env_var: MAX_POSITION_PCT
    description: "Per-trade MARGIN cap as % of equity (check #2) while per_strategy_notional_cap_enabled is off, and for a strategy type with no *_max_position_pct of its own. Not the risk budget, which is StrategyTypeConfig.*_max_risk_pct"

  per_strategy_notional_cap_enabled:
    value: true
    env_var: PER_STRATEGY_NOTIONAL_CAP_ENABLED
    description: "Use the per-strategy notional cap (StrategyTypeConfig) instead of the global max_position_pct for the size cap + POSITION_SIZE check"

  intent_policy_enabled:
    value: false
    env_var: INTENT_POLICY_ENABLED
    description: >
      Guardian Formal Strategy Intent Compiler: when on, a compiled, tighten-only
      policy (config/intent_policy.json) is consulted at the risk gate as an
      additional deterministic check that can only ADD rejections. Default OFF;
      when enabled a policy still defaults to shadow mode (logs would-be
      rejections, blocks nothing) until explicitly set to enforce.

  authority_envelope_enabled:
    value: false
    env_var: AUTHORITY_ENVELOPE_ENABLED
    description: >
      Guardian Authority Envelope (custody boundary): when on, a bound, compiled
      envelope (bot/guardian/authority.py) is consulted at the risk gate as an
      additional deterministic, tighten-only check on what the credential may do
      (per-trade notional, symbol scope, expiry, revocation). Default OFF; when
      enabled an envelope still defaults to shadow mode (records would-be denials,
      blocks nothing) until explicitly set to enforce. Fail-open bridge over a
      fail-closed core.

  validation_gate_enabled:
    value: false
    env_var: VALIDATION_GATE_ENABLED
    description: >
      Backtest Validation Gate: when on, the risk gate asks
      bot/core/validation_gate.py whether this idea's strategy_type has ever
      been backtested to a passing Sharpe (>= 0.6) over a real sample (>= 10
      trades). Tighten-only and fail-open, like the intent-policy and authority
      hooks: it can only add a rejection, and any fault leaves the trade
      untouched. Default OFF. Records are written automatically by
      bot/backtest/runner.py and persist to <state>/validations.json — a
      SYNTHETIC backtest records nothing, so a fabricated Sharpe can never sit
      behind a gate that answers "has this been shown to work on real data".

  validation_gate_mode:
    value: shadow
    env_var: VALIDATION_GATE_MODE
    description: >
      off / shadow / enforce, the same ladder as the integrity veto and the
      authority envelope. Default shadow, and the ordering matters: the store
      starts EMPTY, so on the first run after enabling the gate every strategy
      reads never_tested. In enforce that is a full trading halt attributable to
      nothing the operator changed that day. Shadow records what it would have
      rejected until the backtest runner has populated the store; only then is
      enforce a decision about strategies rather than about an empty file.

  validation_gate_allow_untested:
    value: true
    env_var: VALIDATION_GATE_ALLOW_UNTESTED
    description: >
      Under enforce, may a strategy nobody has ever backtested still trade?
      Default TRUE. never_tested is an ABSENT measurement, not a failed one, and
      refusing every unmeasured strategy is the empty-store halt made permanent.
      Set false once the runner has validated the strategies you actually run;
      then "never tested" genuinely means "not approved" rather than "not yet
      looked at".

  guardian_firewall_enabled:
    value: true
    env_var: GUARDIAN_FIREWALL_ENABLED
    description: >
      Guardian Prompt-Injection & Transaction Firewall: when on, inbound
      chat-action text (Telegram free text / web chat) is scanned for manipulation
      shapes before it can steer an agent that acts, and a FIREWALL verdict is
      sealed to the tamper-evident chain. Default ON; telemetry-first — it records
      and can warn, but never blocks a message unless guardian_firewall_block_high
      is also enabled.

  guardian_firewall_block_high:
    value: false
    env_var: GUARDIAN_FIREWALL_BLOCK_HIGH
    description: >
      With guardian_firewall_enabled on, refuse to act on a HIGH-risk chat verdict
      (the message is recorded and rejected) instead of merely recording it.
      Default OFF so enabling the firewall observes before it ever blocks.

  guardian_digital_twin_enabled:
    value: true
    env_var: GUARDIAN_DIGITAL_TWIN_ENABLED
    description: >
      Guardian Portfolio Digital Twin: when on, a stress-test verdict (projected
      drawdown + liquidations under parametric price shocks) is sealed to the
      tamper-evident chain each time the twin runs. Default ON; the twin is pure,
      read-only foresight that still computes on demand (e.g. the admin /twin
      command) even when off — it never proposes, blocks, or alters a trade.

  guardian_risk_sentinel_enabled:
    value: true
    env_var: GUARDIAN_RISK_SENTINEL_ENABLED
    description: >
      Guardian Systemic Risk Sentinel: when on, an intra-book crowding verdict
      (correlated concentration, directional bias, same-group clusters, shared
      liquidation zones) is sealed to the tamper-evident chain each time the
      sentinel runs. Default ON; the sentinel is pure, read-only telemetry that
      still computes on demand (e.g. the admin /sentinel command) even when off —
      it warns about structural crowding but never blocks or alters a trade.

  guardian_escape_enabled:
    value: true
    env_var: GUARDIAN_ESCAPE_ENABLED
    description: >
      Guardian Universal Escape Agent: when on, a safe, ordered emergency-exit
      PLAN (which position to close first and why, ranked by liquidation
      urgency × exposure) is sealed to the tamper-evident chain each time the
      planner runs. Default ON; the planner is pure, read-only and still computes
      on demand (e.g. the admin /escape command) even when off. It PLANS only —
      it never closes anything; execution stays with the existing kill-switch
      stack (flatten_all_positions / close_all_positions / emergency_halt_all).

  per_strategy_confidence_floor_enabled:
    value: false
    env_var: PER_STRATEGY_CONFIDENCE_FLOOR_ENABLED
    description: >
      Use the per-strategy-type confidence floor (StrategyTypeConfig.get_min_confidence:
      scalp 0.65 / intraday 0.55 / swing 0.50 / position 0.45) instead of the
      global min_confidence for the CONFIDENCE check. Frozen-benchmark A/B'd
      (docs/FROZEN_BENCHMARK.md).

  max_daily_loss_pct:
    value: 5.0
    env_var: MAX_DAILY_LOSS_PCT
    description: "Max daily loss as % of equity before circuit breaker trips"

  daily_loss_breaker_min_usd:
    value: 0.0
    env_var: DAILY_LOSS_BREAKER_MIN_USD
    description: "Absolute-USD floor on the daily-loss breaker (0 = pure %); the breaker trips only when the day's loss exceeds BOTH the % cap and this dollar amount (stops micro-account noise from halting the day)"

  daily_loss_breaker_autoreset_enabled:
    value: true
    env_var: DAILY_LOSS_BREAKER_AUTORESET
    description: "Auto-reset a daily-loss circuit-breaker trip at UTC day rollover (drawdown/streak/manual stay manual)"

  streak_breaker_autoreset_hours:
    value: 0.0
    env_var: STREAK_BREAKER_AUTORESET_HOURS
    description: >
      Hours after the last loss to auto-clear a CONSECUTIVE-LOSS breaker trip
      (resets the streak to 0, like /resume) so an unattended live bot resumes
      instead of latching PAUSED. Only the streak cause; daily-loss/drawdown/
      manual keep their own paths. 0 = OFF (manual-reset only). Automates
      resuming — the drawdown breaker remains the account-drain backstop.

  max_drawdown_pct:
    value: 10.0
    env_var: MAX_DRAWDOWN_PCT
    description: "Max drawdown from equity HWM before circuit breaker trips"

  max_open_positions:
    value: 5
    env_var: MAX_OPEN_POSITIONS
    description: "Maximum number of concurrent open positions"

  max_correlation:
    value: 0.85
    env_var: MAX_CORRELATION
    description: "Rolling-return correlation threshold of CORRELATION_V2 (check #8): on the paper book a same-direction position correlated above this with an open one is rejected. Not evaluated on the live book"

  min_risk_reward:
    value: 1.2
    env_var: MIN_RISK_REWARD
    description: "A global reward:risk figure that status cards print and the intent-policy compiler treats as the engine's floor. The RISK_REWARD check (#6) does NOT read it: it reads the per-strategy StrategyTypeConfig.*_min_rr"

  min_confidence:
    value: 0.60
    env_var: MIN_CONFIDENCE
    description: "Minimum analyzer confidence score (raised 0.55->0.60: frozen-benchmark A/B, docs/FROZEN_BENCHMARK.md)"

  signal_display_min_confidence:
    value: 0.70
    env_var: SIGNAL_DISPLAY_MIN_CONFIDENCE
    description: "Minimum confidence for a signal to appear in the 'Latest Signal' display"

  max_consecutive_losses:
    value: 5
    env_var: MAX_CONSECUTIVE_LOSSES
    description: "Consecutive losses before circuit breaker trips (soft reject at 3)"

  loss_streak_probe_hours:
    value: 24.0
    env_var: LOSS_STREAK_PROBE_HOURS
    description: >
      Cool-off since the last loss after which the soft loss-streak gate
      allows one probe trade at a time (only while flat). Prevents the soft
      gate from becoming a permanent silent latch — the streak only decays on
      wins, which can't happen while trading is blocked. 0 = legacy latch.

  strangle_alert_hours:
    value: 12.0
    env_var: STRANGLE_ALERT_HOURS
    description: >
      Silent-strangle watchdog window: proactively WARN the operator when at
      least strangle_min_ideas were evaluated over this many hours with ZERO
      approvals, naming the top rejecting gate. Catches silently latched or
      misconfigured gates (bot scans but never trades). 0 = off.

  strangle_min_ideas:
    value: 10
    env_var: STRANGLE_MIN_IDEAS
    description: >
      Minimum ideas evaluated in the watchdog window before a zero-approval
      state counts as a strangle (avoids false alarms in quiet markets).

  cooldown_after_loss_seconds:
    value: 120
    env_var: COOLDOWN_AFTER_LOSS_SEC
    description: "Seconds to wait after a losing trade before allowing new entries"

  symbol_loss_streak_enabled:
    value: true
    env_var: SYMBOL_LOSS_STREAK_ENABLED
    description: "Track consecutive losses per symbol (not just account-wide) and arm a long cooldown on that symbol once the streak threshold is hit"

  live_universe_gate_enabled:
    value: true
    env_var: LIVE_UNIVERSE_GATE_ENABLED
    description: "A live order stays in the markets a card measured: the LIVE_UNIVERSE check refuses a live order on a market outside the benchmark on record's universe (benchmark/majors_1h). The scan, the analysis and the paper book still reach every market"

  live_universe:
    value: ""
    env_var: LIVE_UNIVERSE
    description: "The operator's own measured set, a comma list of markets (BTC,ETH,...), replacing the benchmark's when set. Empty reads the benchmark manifest"

  symbol_loss_streak_threshold:
    value: 3
    env_var: SYMBOL_LOSS_STREAK_THRESHOLD
    description: "Consecutive losses on the SAME symbol before its loss-streak cooldown arms"

  symbol_loss_streak_cooldown_seconds:
    value: 43200.0
    env_var: SYMBOL_LOSS_STREAK_COOLDOWN_SEC
    description: "Seconds a symbol is blocked from new entries after its loss-streak cooldown arms (default 12h)"

  max_portfolio_exposure_pct:
    value: 80.0
    env_var: MAX_PORTFOLIO_EXPOSURE_PCT
    description: "Max total portfolio exposure as % of equity (mark-to-market)"

  max_symbol_exposure_pct:
    value: 20.0
    env_var: MAX_SYMBOL_EXPOSURE_PCT
    description: "Max per-symbol exposure (committed margin, existing + new) as % of equity (check #15). Not the per-trade cap, which is check #2's"

  max_correlation_per_group:
    value: 2
    env_var: MAX_CORRELATION_PER_GROUP
    description: "Max positions allowed in the same correlation group"

  max_unmapped_correlated:
    value: 3
    env_var: MAX_UNMAPPED_CORRELATED
    description: "Max concurrent positions in the shared unmapped-alt bucket (symbols not in the correlation map). Set high to disable."

  correlation_forward_intents_enabled:
    value: false
    env_var: CORRELATION_FORWARD_INTENTS_ENABLED
    description: "Round 7 Phase 1: count approved-but-not-yet-filled intents in the per-group correlation cap so a correlated same-bar cluster can't all bypass it. Default OFF pending A/B validation."

  correlation_intent_ttl_sec:
    value: 7200.0
    env_var: CORRELATION_INTENT_TTL_SEC
    description: "Safety TTL (seconds) for a pending correlation intent; backstops a leaked intent so the ledger can't latch the cap. Explicit clear on fill/cancel is primary."

  correlation_perp_group_mapping_enabled:
    value: false
    env_var: CORRELATION_PERP_GROUP_MAPPING_ENABLED
    description: "Round 7: strip the ccxt ':SETTLE' suffix so perp symbols map to their real correlation group (ALT_L1/MEME/DEFI) instead of pooling into one unmapped bucket. Default OFF — correct per-group caps loosen aggregate exposure and raised drawdown on the dense A/B; enable only with a global correlated cap."

  max_correlated_same_dir_positions:
    value: 0
    env_var: MAX_CORRELATED_SAME_DIR_POSITIONS
    description: "Round 7 revised Phase 2: cap on concurrent SAME-DIRECTION positions across all correlated groups (open + pending intents). Restores an aggregate exposure bound when per-group mapping is enabled. 0 = disabled (default); only active with correlation_perp_group_mapping_enabled."

  live_book_risk_gates_enabled:
    value: true
    env_var: LIVE_BOOK_RISK_GATES_ENABLED
    description: "In live mode the correlation caps, the two exposure caps and correlation sizing read the book a new trade joins (the executor's open and resting positions) instead of the paper tracker, which no live fill writes. OFF measures the same gates on the live book and reports their refusals without refusing. Paper and backtest evaluations are the same either way."

  fee_aware_entry_gate_enabled:
    value: false
    env_var: FEE_AWARE_ENTRY_GATE_ENABLED
    description: "Reject an entry unless reward-to-TP >= fee_aware_min_multiple x round-trip cost (fees + slippage). Complements min-RR (a ratio) by enforcing an ABSOLUTE fee-clearing edge. Default OFF pending A/B; skips manual trades."

  fee_aware_min_multiple:
    value: 2.0
    env_var: FEE_AWARE_MIN_MULTIPLE
    description: "Safety multiple for the fee-aware entry gate: TP reward must be at least this x the round-trip cost."

  fee_aware_slippage_pct:
    value: 0.05
    env_var: FEE_AWARE_SLIPPAGE_PCT
    description: "Per-side slippage estimate (%) used in the fee-aware gate's round-trip cost (2x entry + exit)."

  reentry_cooldown_enabled:
    value: false
    env_var: REENTRY_COOLDOWN_ENABLED
    description: "Throttle a fresh entry on a symbol within reentry_cooldown_seconds of the last REAL fill on that symbol (curbs fee churn; complements the loss-only cooldown). Default OFF; skips manual trades."

  reentry_cooldown_seconds:
    value: 0.0
    env_var: REENTRY_COOLDOWN_SECONDS
    description: "Seconds to block same-symbol re-entry after the last fill on that symbol. 0 or flag OFF = no-op."

  mtf_alignment_gate_enabled:
    value: true
    env_var: MTF_ALIGNMENT_GATE_ENABLED
    description: "Reject counter-trend entries using the analyzer's higher-timeframe trend (the daily timeframe's EMA20/EMA50 trend, 4h when there are no daily candles, carried on idea.htf_trend): LONG blocked when HTF bearish, SHORT when HTF bullish. Neutral/unknown = skip. Default ON (operator-activated after a positive A/B: PF 1.87->2.23 on corr_dense_1h; set 0 to disable)."

  volatility_guard_atr_pct:
    value: 7.0
    env_var: VOLATILITY_GUARD_ATR_PCT
    description: "Max ATR as % of price; trades above this are rejected (check #16). A MEME-group symbol gets max(this, 10%), a wider threshold"

  stale_data_max_age_seconds:
    value: 300
    env_var: STALE_DATA_MAX_AGE_SEC
    description: "Max age of trade idea in seconds before it is considered stale"

  require_stop_loss:
    value: true
    env_var: REQUIRE_STOP_LOSS
    description: "Whether a valid stop-loss is required on every trade"

  max_portfolio_var_pct:
    value: 15.0
    env_var: MAX_PORTFOLIO_VAR_PCT
    description: "Max portfolio Value at Risk as % of equity (parametric, 95% confidence)"

  var_covariance_enabled:
    value: false
    env_var: VAR_COVARIANCE_ENABLED
    description: "Opt-in (default off): compute portfolio VaR from a real covariance matrix across held assets instead of the per-trade-return proxy; falls back to the proxy when price history is insufficient"

  var_covariance_min_points:
    value: 20
    env_var: VAR_COVARIANCE_MIN_POINTS
    description: "Minimum aligned price-return observations per asset required before the covariance VaR path is used (otherwise it falls back to the per-trade proxy)"

  commission_pct:
    value: 0.06
    env_var: COMMISSION_PCT
    description: "Exchange commission per side (taker fee), used in PnL calculations"

  taker_fee_pct:
    value: 0.06
    env_var: TAKER_FEE_PCT
    description: "Taker fee per side (used for accurate PnL when order type is known)"

  maker_fee_pct:
    value: 0.02
    env_var: MAKER_FEE_PCT
    description: "Maker fee per side (used for accurate PnL when order type is known)"

  max_margin_risk_pct:
    value: null
    env_var: MAX_MARGIN_RISK_PCT
    description: "Leverage-aware cap: SL distance x the venue's leverage must not exceed this % of the venue's margin. Unset: 30% at the sizing leverage scaled to the venue's (60% at 10x sized at 5x), a 6% stop either way"

  equity_curve_ma_period:
    value: 20
    env_var: EQUITY_CURVE_MA_PERIOD
    description: "Lookback for the equity-curve moving average (circuit breaker)"

  equity_curve_pause_stddev:
    value: 2.0
    env_var: EQUITY_CURVE_PAUSE_STDDEV
    description: "Std-dev band below the equity MA that halves position sizes"

  equity_curve_breaker_enabled:
    value: false
    env_var: EQUITY_CURVE_BREAKER_ENABLED
    description: "Feed record_equity_snapshot() from evaluate() to drive the equity-curve breaker (opt-in; adds a pause/de-risk condition)"

  vol_target_sizing_enabled:
    value: true
    env_var: VOL_TARGET_SIZING_ENABLED
    description: "Float the binding notional cap inversely with ATR% so per-trade dollar risk is vol-targeted, not flat-margin (tighten-only; A/B-validated, default ON, disable with VOL_TARGET_SIZING_ENABLED=0)"

  vol_target_atr_pct:
    value: 3.0
    env_var: VOL_TARGET_ATR_PCT
    description: "Target ATR% the volatility-target cap normalizes per-trade risk toward"

  vol_target_floor:
    value: 0.33
    env_var: VOL_TARGET_FLOOR
    description: "Floor on the vol-target multiplier — how far the notional cap may shrink"

  drawdown_recovery_conf_min:
    value: 0.85
    env_var: DRAWDOWN_RECOVERY_CONF_MIN
    description: "Minimum confidence required while in drawdown-recovery mode"

  drawdown_recovery_size_mult:
    value: 0.5
    env_var: DRAWDOWN_RECOVERY_SIZE_MULT
    description: "Position-size multiplier applied while in drawdown-recovery mode"

  drawdown_recovery_enabled:
    value: false
    env_var: DRAWDOWN_RECOVERY_ENABLED
    description: "Drive check_drawdown_recovery() from evaluate() so recovery mode can activate (opt-in; adds a higher-confidence + reduced-size restriction)"

  min_book_depth_usd:
    value: 2000.0
    env_var: MIN_BOOK_DEPTH_USD
    description: >
      DEAD KNOB, kept for env compatibility: nothing reads this field, and
      setting MIN_BOOK_DEPTH_USD changes nothing. The liquidity guard (check
      #17) reads OrderFlowConfig.min_top_depth_usd (OF_MIN_DEPTH_USD) and
      OrderFlowConfig.large_cap_depth_floor_usd (OF_LARGE_CAP_DEPTH_FLOOR_USD).

  kelly_sizing_enabled:
    value: true
    env_var: KELLY_SIZING_ENABLED
    description: >
      Half-Kelly sizing (default ON; runbook stage 2). evaluate() takes the
      SMALLER of the fixed-fractional size and the half-Kelly size from realized
      history — tighten-only, never grows size; the notional/margin caps stay
      authoritative.

  kelly_min_trades:
    value: 20
    env_var: KELLY_MIN_TRADES
    description: >
      Minimum closed trades before Kelly sizing has an edge estimate. Below this
      it is a no-op (fixed-fractional size is left unchanged).

  correlation_sizing_enabled:
    value: true
    env_var: CORRELATION_SIZING_ENABLED
    description: >
      Portfolio-aware correlation sizing (default ON; shrink-only). Shrinks a new
      trade that stacks on already-open positions in the SAME correlation group
      AND direction — only reduces (multiplier in [floor, 1.0]); the notional and
      margin caps stay authoritative. Byte-identical to prior behaviour when OFF.

  correlation_sizing_step:
    value: 0.20
    env_var: CORRELATION_SIZING_STEP
    description: >
      Size reduction per same-group, same-direction open position (0.20 = -20%
      each). Applied before the notional cap; floored by correlation_sizing_floor.

  correlation_sizing_floor:
    value: 0.5
    env_var: CORRELATION_SIZING_FLOOR
    description: >
      Floor on the correlation size multiplier — a new correlated trade is never
      sized below this fraction of its full fixed-fractional size.

  live_risk_hardening_enabled:
    value: true
    env_var: LIVE_RISK_HARDENING_ENABLED
    description: >
      Default ON (runbook stage 1). When ON and running live, applies a stricter
      portfolio-risk posture for real money without touching paper/backtest:
      forces correlation-aware sizing on, forces covariance VaR on (falling back
      to the per-trade proxy when data is thin — never a downgrade to skip), and
      caps drawdown at live_max_drawdown_pct. Never applies in paper mode.

  live_max_drawdown_pct:
    value: 7.0
    env_var: LIVE_MAX_DRAWDOWN_PCT
    description: >
      Tighter max-drawdown limit applied only when live risk hardening is active
      (live + LIVE_RISK_HARDENING_ENABLED). In paper mode the standard
      max_drawdown_pct applies.

  persist_live_drawdown_peak:
    value: false
    env_var: PERSIST_LIVE_DRAWDOWN_PEAK
    description: >
      Persist the live drawdown high-water mark across restarts. Default OFF:
      a restart re-seeds the peak at current equity, which also means a 6%
      loss + restart + 6% loss never trips the 7% breaker — the protection's
      memory dies with the process. ON closes that hole; the cost is that a
      fund transfer followed by a restart now trips the breaker on the
      withdrawal gap (the trip card's transfer hint names it; /resume
      re-seeds the peak). Opt-in because it changes when a live safety gate
      fires.

  user_risk_pref_sizing_enabled:
    value: false
    env_var: USER_RISK_PREF_SIZING_ENABLED
    description: >
      Default OFF. A per-user engine scales its own size by the user's
      self-declared risk appetite (bot/core/user_sizing.py): conservative
      0.70x, balanced and aggressive 1.0x. TIGHTEN-ONLY — nothing writable
      from a web form may enlarge a position. Applies to the notional CAP as
      well as the pre-cap size, because the cap binds on ~every crypto trade
      and a pre-cap multiply alone is clamped straight back (the same no-op
      that silently neutered every regime reduction). An unreadable profile
      changes nothing: a size nobody chose, decided by a failed file read, is
      worse than no adjustment. Only PER-USER engines carry an identity, so
      the operator and auto-trade paths are byte-identical either way. While
      OFF the engine still audits the would-be delta with result="SHADOW".

  quality_ladder_size_enabled:
    value: false
    env_var: QUALITY_LADDER_SIZE_ENABLED
    description: >
      Default OFF. Trade QUALITY chooses a size within the bounds
      (bot/risk/quality_ladder.py): the rung table maps the analyzer's
      MEASURED confidence to a tighten-only size multiplier, applied to the
      pre-cap size AND to the notional cap (a pre-cap multiply alone is
      clamped straight back). A manual ticket's confidence is a stamp, not a
      measurement, and takes no rung; an unreadable confidence changes
      nothing and says so on the check line. While OFF the engine audits the
      rung it would have applied with result="SHADOW".

  quality_ladder_leverage_enabled:
    value: false
    env_var: QUALITY_LADDER_LEVERAGE_ENABLED
    description: >
      Default OFF. The ladder's other half: the rung's leverage multiplier
      caps the leverage the VENUE is set to, through the same reduce-only
      attribute the margin-risk cap writes, so the cap bounds what fills
      rather than what the order was sized at. The margin-risk verdict is
      then measured at the capped leverage. Reduce-only and floored at
      MIN_LEVERAGE; never above the standard leverage. While OFF the engine
      audits the rung it would have applied with result="SHADOW".

  quality_ladder_rungs:
    value: "A:0.85:1.0:1.0,B:0.70:0.75:0.8,C:0.0:0.5:0.6"
    env_var: QUALITY_LADDER_RUNGS
    description: >
      The rung table both ladder halves read: `name:floor:size_mult:lev_mult`
      rows, comma-separated, floors descending, the last floor 0.0 so every
      measured confidence lands on a rung. Every multiplier must be in
      (0, 1] — growth is not a rung — and a table that does not parse falls
      back to this default with a note on the check line rather than
      raising or silently sizing off a half-read table.

  regime_sizing_enabled:
    value: true
    env_var: REGIME_SIZING_ENABLED
    description: >
      Default ON. Bridges the analyzer's per-symbol market regime into
      the risk engine before each evaluate(), so the per-regime position-size
      multiplier actually applies (CHOP 0.5× / RANGE 0.7× reduce; TREND 1.2× /
      EXPANSION 1.3× increase). The notional/margin cap stays the final
      authority. OFF → regime stays UNKNOWN → 1.0× (byte-identical).

  trend_up_size_mult:
    value: 0.7
    env_var: TREND_UP_SIZE_MULT
    description: >
      TREND_UP position-size multiplier override (down from the static
      table's 1.2× boost — frozen-benchmark A/B, docs/FROZEN_BENCHMARK.md).
      Also tightens the notional cap itself when <1.0 (not just the pre-cap
      value), since the fixed-fractional pre-cap size routinely exceeds the
      cap and a sub-1.0 mult on the pre-cap value alone was previously a
      no-op. Scoped to TREND_UP only; CHOP/RANGE keep their static-table
      values unchanged.

  live_performance_governor_enabled:
    value: true
    env_var: LIVE_PERFORMANCE_GOVERNOR_ENABLED
    description: >
      Default ON (runbook stage 2). A closed-loop backstop on top of the pre-trade
      checks: scores REALIZED closed-trade outcomes over a rolling window and
      de-risks when the strategy is actually losing — graduated size reduction
      when the recent window underperforms (low win rate OR net-negative), and a
      pause (size 0, trade rejected) only when it is BOTH losing often AND
      net-negative. Tighten-only; no-op below live_perf_min_samples trades.

  live_perf_window:
    value: 20
    env_var: LIVE_PERF_WINDOW
    description: >
      Rolling window of most-recent closed trades the live-performance governor
      scores for win rate and net PnL.

  live_perf_min_samples:
    value: 5
    env_var: LIVE_PERF_MIN_SAMPLES
    description: >
      Minimum closed trades before the governor acts. Below this the window is
      too small to judge, so the governor is a no-op (full size). Lowered 10→5
      after Round-6 OOS A/B (docs/FROZEN_BENCHMARK.md): engaging a fold sooner
      improved combined v2 OOS −1.58%→−1.42% (PF 0.23→0.25) with a byte-
      identical original in-sample window.

  live_perf_reduce_winrate:
    value: 0.40
    env_var: LIVE_PERF_REDUCE_WINRATE
    description: >
      Win rate at/below which the recent window counts as underperforming and
      the governor applies live_perf_reduce_mult (also triggers on net-negative
      window PnL).

  live_perf_pause_winrate:
    value: 0.25
    env_var: LIVE_PERF_PAUSE_WINRATE
    description: >
      Win rate at/below which — AND with a net-negative window — the governor
      pauses trading (size 0, trade rejected) rather than merely reducing.

  live_perf_reduce_mult:
    value: 0.5
    env_var: LIVE_PERF_REDUCE_MULT
    description: >
      Size multiplier applied while the governor is in the reduce zone.

  live_perf_probe_hours:
    value: 24.0
    env_var: LIVE_PERF_PROBE_HOURS
    description: >
      The way out of a pause, which opens nothing and so could never lift on a
      flat book. After this many hours since the last close, with no position
      open, one entry goes through at the reduce size; its close enters the
      window. 0 turns probing off. /resume and /reset also clear a pause by
      hand: the governor then scores only closes after the clear, at full size
      until live_perf_min_samples are on record.

  funding_clock_gate_enabled:
    value: true
    env_var: FUNDING_CLOCK_GATE_ENABLED
    description: >
      Funding-clock gate: blocks an entry only when it would sit on the
      PAYING side of an extreme funding rate inside the pre-settlement
      window (Bitget USDT perps settle 00/08/16 UTC). Narrow by
      construction, fail-open on missing funding data, and every block is
      priced by the shadow book.

  funding_clock_window_min:
    value: 30
    env_var: FUNDING_CLOCK_WINDOW_MIN
    description: >
      Minutes before a funding settlement during which the gate is armed.

  funding_clock_extreme_rate:
    value: 0.0005
    env_var: FUNDING_CLOCK_EXTREME_RATE
    description: >
      Absolute 8h funding rate at/above which the rate counts as extreme
      (0.0005 = 0.05% per interval).

  equity_throttle_enabled:
    value: false
    env_var: EQUITY_THROTTLE_ENABLED
    description: >
      Continuous equity-curve throttle: scales position size off the rolling
      profit factor of recent realized closes via a linear ramp, instead of
      the governor's discrete steps. Tighten-only; never pauses (the floor
      keeps trades flowing so the window refreshes and recovery is
      observable). Default OFF pending the frozen-benchmark A/B.

  equity_throttle_window:
    value: 20
    env_var: EQUITY_THROTTLE_WINDOW
    description: >
      Rolling window of most-recent closed trades whose profit factor drives
      the throttle.

  equity_throttle_min_samples:
    value: 10
    env_var: EQUITY_THROTTLE_MIN_SAMPLES
    description: >
      Minimum closed trades before the throttle acts (below this it fails
      open to full size — never penalise a cold start).

  equity_throttle_pf_full:
    value: 1.2
    env_var: EQUITY_THROTTLE_PF_FULL
    description: >
      Rolling PF at/above which the throttle allows full size.

  equity_throttle_pf_floor:
    value: 0.8
    env_var: EQUITY_THROTTLE_PF_FLOOR
    description: >
      Rolling PF at/below which the throttle sits at its minimum multiplier;
      between floor and full the multiplier ramps linearly.

  equity_throttle_floor_mult:
    value: 0.25
    env_var: EQUITY_THROTTLE_FLOOR_MULT
    description: >
      Minimum size multiplier — deliberately above zero so a losing streak
      reduces exposure without stopping the flow of closed trades needed to
      demonstrate recovery.

  macro_calendar_fail_closed_when_stale:
    value: true
    env_var: MACRO_CALENDAR_FAIL_CLOSED_WHEN_STALE
    description: >
      Default ON (safe). When the hardcoded macro event schedule is exhausted
      (every event is in the past), the calendar fails closed (BLACKOUT → new
      entries blocked) and the monitor alerts, instead of silently reporting
      NORMAL with all FOMC/CPI event protection gone. No effect while future
      events remain. Set False to knowingly accept the gap (alert still fires).

