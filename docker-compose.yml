# =============================================================================
# RUNECLAW v2 Docker Compose -- Bot + API Bridge + Redis + Nginx
# =============================================================================

services:

  # -- Telegram bot -----------------------------------------------------------
  # The bot runs an internal dashboard server on port 8080 (not host-exposed).
  # Healthcheck verifies the dashboard is responsive.
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    image: runeclaw:latest
    container_name: runeclaw-bot
    restart: unless-stopped
    command: python -m bot.main --mode telegram
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api_bridge:
        condition: service_healthy
    healthcheck:
      # NOT `pgrep -f 'bot.main'`. CMD-SHELL runs the check as
      # `/bin/sh -c "pgrep -f 'bot.main' > /dev/null"`, and THAT shell's own
      # /proc/<pid>/cmdline contains the string `bot.main` — so pgrep matched
      # itself and the check could never fail. Reproduced with no bot running:
      # it returned the checker's own wrapper and reported healthy. A dead
      # live-trading bot showed green in `docker ps` indefinitely, and
      # api_bridge's `depends_on: service_healthy` was satisfied by nothing.
      # CLAUDE.md records the same bug being found and fixed in
      # scripts/verify_bot_alive.sh; it was never carried across to here.
      #
      # `command:` above makes the bot PID 1 of this container, so reading
      # /proc/1/cmdline asks about the bot and nothing else. The checker's
      # shell is never PID 1, so this cannot self-match BY CONSTRUCTION rather
      # than by choosing a cleverer pattern — a `[b]ot` bracket trick still
      # breaks the moment any ancestor's cmdline happens to carry the string.
      # `bot[.]main` keeps the dot literal without needing a backslash through
      # YAML quoting.
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'bot[.]main'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - runeclaw_net
    deploy:
      resources:
        limits:   { cpus: '1.0', memory: '2G' }
        reservations: { cpus: '0.5', memory: '512M' }

  # -- API Bridge (FastAPI) ---------------------------------------------------
  api_bridge:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    image: runeclaw:latest
    container_name: runeclaw-api
    restart: unless-stopped
    # H1: --proxy-headers --forwarded-allow-ips='*' is GONE, and its removal is
    # the load-bearing half of that fix.
    #
    # In always-trust mode uvicorn takes the LEFT-most X-Forwarded-For entry and
    # overwrites scope["client"], while nginx sets
    # `X-Forwarded-For $proxy_add_x_forwarded_for` (nginx.conf:66, :104), which
    # APPENDS the real peer on the RIGHT. The left-most entry is therefore
    # whatever the caller typed, so `request.client.host` was attacker-chosen
    # before any application code ran — including the per-IP login lockout.
    # Rotating one header bought a fresh rate-limit and lockout bucket per
    # request.
    #
    # Without the flags, `request.client.host` is the nginx container, which
    # TRUSTED_PROXY names — so bot/utils/client_ip.py believes the headers that
    # hop wrote (X-Real-IP, set from $remote_addr and not forgeable past it) and
    # nothing else. Reach this service directly and the peer is not trusted, so
    # the headers are ignored and the connection is the only evidence.
    # ONE WORKER, DELIBERATELY. api_bridge's lifespan constructs its own
    # RuneClawEngine per worker, and every worker mounts the same ./data as
    # the bot container below. At --workers 2 that was THREE engines sharing
    # one paper book, which PortfolioTracker loads once and then overwrites
    # whole — so a second writer did not merge, it erased. Raising this again
    # needs the state to stop being per-process first, not just a bigger
    # number here.
    command: >
      uvicorn api_bridge:app
      --host 0.0.0.0
      --port 8000
      --workers 1
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - runeclaw_net
    deploy:
      resources:
        limits:   { cpus: '1.0', memory: '1G' }
        reservations: { cpus: '0.25', memory: '256M' }

  # -- Redis ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: runeclaw-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      # REDISCLI_AUTH, not `-a`: an argv password is visible to every process
      # on the host via `ps`, and to anyone who can run `docker inspect` on the
      # container. redis-cli reads this variable for exactly this reason and
      # stops warning about the insecure form as a side benefit.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - runeclaw_net
    deploy:
      resources:
        limits:   { cpus: '0.5', memory: '256M' }
        reservations: { cpus: '0.25', memory: '64M' }

  # -- Nginx TLS reverse proxy ------------------------------------------------
  # Serves dashboard on 443, proxies /api/* -> api_bridge:8000
  # Requires: certbot certs at /etc/letsencrypt/live/$RUNECLAW_DOMAIN/
  # To skip TLS in dev: comment out nginx and expose api_bridge:8000 directly
  nginx:
    image: nginx:1.27-alpine
    container_name: runeclaw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # nginx.conf is a TEMPLATE, mounted where the nginx:1.27-alpine entrypoint
    # runs envsubst over it before nginx parses anything. It used to be mounted
    # directly as conf.d/default.conf while still containing the literal
    # YOUR_DOMAIN in its certificate paths — a stack that could not start.
    # RUNECLAW_DOMAIN comes from .env (see .env.example).
    environment:
      RUNECLAW_DOMAIN: ${RUNECLAW_DOMAIN:?RUNECLAW_DOMAIN must be set in .env}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./website:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot:/var/www/certbot:ro
    depends_on:
      api_bridge:
        condition: service_healthy
    networks:
      - runeclaw_net
    deploy:
      resources:
        limits:   { cpus: '0.25', memory: '128M' }

volumes:
  redis_data:

networks:
  runeclaw_net:
    driver: bridge
    # Pinned so TRUSTED_PROXY has something stable to name. A bridge network
    # without an explicit subnet gets whatever Docker allocates, and containers
    # get whatever address is free within it — so "trust the nginx container"
    # was not expressible as configuration until this existed. Set
    # TRUSTED_PROXY=172.28.0.0/16 in .env to match.
    ipam:
      config:
        - subnet: 172.28.0.0/16
