# Anchor workspace — DRAFT / DEVNET-ONLY. $RCLAW staking program.
# Replace the program id after `anchor keys sync` on first build.

# Pinned so the deployed bytecode is reproducible and can be verified against
# this source. An empty [toolchain] resolves to whatever the builder happens to
# have installed, which makes verification meaningless. The Rust compiler itself
# is pinned separately in rust-toolchain.toml — all three inputs (anchor, solana,
# rustc) must be fixed for a build to be reproducible.
[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.devnet]
rclaw_staking = "6yGc2n7vZyp7nvJJ8uXEdy56P1UT8Ma4En26bTtBrJhW"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The TS spec lives beside the program. Running it needs a root tsconfig.json +
# package.json with @coral-xyz/anchor, @solana/spl-token, ts-mocha, chai — none
# of which are committed yet, so `anchor test` is not runnable as-is. Documented
# in programs/rclaw_staking/README.md rather than left as a silently broken glob.
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 programs/rclaw_staking/tests/**/*.ts"
