# Security headers — defined ONCE, included at every level that needs them.
#
# WHY THIS IS A SEPARATE FILE AND NOT SIX LINES IN THE SERVER BLOCK
#
# nginx inherits `add_header` into a `location` only if that location declares
# NO `add_header` of its own. Every location in default.conf declares one —
# `/` and the static-asset regex set Cache-Control, `/api/` sets CORS — so a
# server-level block was inherited by nothing at all. The site shipped with no
# CSP, no HSTS and no clickjacking protection while the config read as though
# it had all three.
#
# There is no inheritance escape in nginx. The repetition is mandatory; making
# it an `include` is what keeps the repetition from drifting.
#
# Anything added here must also be added to the assertion list in
# tests/test_nginx_security_headers.py, which checks that every location
# setting add_header also includes this file.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options            DENY                                  always;
add_header X-Content-Type-Options     nosniff                               always;

# strict-origin-when-cross-origin, not no-referrer-when-downgrade: the latter
# sends the FULL URL to any third-party origin as long as the scheme does not
# downgrade, which on an HTTPS-only site means always.
add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;

# No 'unsafe-inline' for scripts, and no external script host. The app/ Express
# server computes per-block SHA-256 hashes (app/lib/csp.js); this gateway serves
# only the static landing page, which carries no inline script at all — so it
# can state the stricter policy outright.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
