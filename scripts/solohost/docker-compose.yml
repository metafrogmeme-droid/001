# RUNECLAW Local: a SoloHost package for Pi Desktop.
#
# SoloHost pastes this file and config_options.yml into Pi Desktop, pulls the
# image (it never builds), writes the install form's answers to .env and runs
# `docker compose up -d`. The rules it enforces are github.com/pi-node/solohost
# SOLOHOST.md; tests/test_the_solohost_package_runs_what_it_says.py holds this
# file to them and to the bot it starts.
#
# PRACTICE ONLY. The safety switches are fixed_values in config_options.yml,
# not fields: an install cannot arm live trading, auto-confirm a live order or
# admit strangers. A SoloHost publish is permissionless and every install is at
# the operator's own risk, so the first package ships the half that cannot lose
# anyone money.
#
# The image is the repository's own Dockerfile, published by
# .github/workflows/image.yml when a v* tag is pushed. Pin the tag here to one
# that workflow has published; the package never names :latest.
services:
  bot:
    image: ghcr.io/metafrogmeme-droid/runeclaw:v1.0.0
    restart: unless-stopped
    command: ["python3", "-m", "bot.main", "--mode", "telegram"]
    labels:
      pi.ui.primary: "true"
    # The bot's own dashboard (bot/web/dashboard_server.py) serves 8080 inside
    # the container. Loopback on the host, a distinctive host port.
    ports:
      - "127.0.0.1:18480:8080"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      SIMULATION_MODE: ${SIMULATION_MODE}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED}
      AUTO_CONFIRM_LIVE_ENABLED: ${AUTO_CONFIRM_LIVE_ENABLED}
      PAPER_AUTO_ACCEPT: ${PAPER_AUTO_ACCEPT}
      PAPER_SIM_OPT_IN_ENABLED: ${PAPER_SIM_OPT_IN_ENABLED}
    # The image's own HEALTHCHECK asks the API bridge on 8000, which this
    # package does not run; ask the dashboard the package does serve.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Named volumes: SoloHost blocks host bind mounts, and the practice book,
    # the user store and the logs must survive a restart.
    volumes:
      - runeclaw_data:/app/data
      - runeclaw_logs:/app/logs

volumes:
  runeclaw_data:
  runeclaw_logs:
