name: Nightly dependency audit

# J5. Advisory only. This workflow is not a pull-request check and must not
# be added to the repository ruleset. A finding does not block a merge.
# `continue-on-error` keeps a known advisory (the token workspace already
# ratchets some) from turning the nightly run red.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24.22.1"

      - name: pip-audit
        continue-on-error: true
        run: |
          python -m pip install --no-cache-dir "pip-audit==2.9.0"
          pip-audit -r requirements.lock
          pip-audit -r requirements-ci.txt

      - name: npm audit
        continue-on-error: true
        run: |
          set +e
          status=0
          for dir in . app site token contracts/memeclaw contracts/rune contracts/rxb contracts/cgc contracts/cover contracts/fvb contracts/kinkcap; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "== $dir =="
              (cd "$dir" && npm ci --no-audit --no-fund && npm audit) || status=1
            else
              echo "== $dir: no lockfile, skipped =="
              status=1
            fi
          done
          exit "$status"
