name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (baseline gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint — syntax errors + undefined names + redefinitions (ruff E9, F821, F811)
        # Lint tests/ too, not just bot/: real errors (duplicate imports/classes
        # that silently shadow earlier definitions, undefined names in dead code)
        # were hiding in the test suite — a third of the codebase — because CI
        # only ever linted bot/. F811 catches the shadowing class specifically.
        run: ruff check --select E9,F821,F811 bot/ tests/

      - name: Lint — unused imports + empty f-strings (ruff F401, F541, ratchet)
        # Backlog cleared and now enforced so it can't regress. bot/ only —
        # intentional probe imports are marked `# noqa: F401`. (Hot-path F841 is
        # deliberately NOT auto-fixed: the roadmap flags some as dropped logic
        # needing manual triage.)
        run: ruff check --select F401,F541 bot/

      - name: Types — mypy on the money modules (ratchet)
        # Gated on the modules that are fully clean today. The list grows as more
        # of bot/core is cleaned, so the type-safety floor only ever ratchets up,
        # never regresses. (Checking live_executor.py also type-checks its imports
        # limit_entry + market_scanner.) The rest of bot/core is not gated yet.
        run: >
          mypy bot/risk bot/compliance bot/utils/trailing.py
          bot/core/bitget_v3_client.py bot/core/position_telemetry.py
          bot/core/live_executor.py

      # M1: the scope was `bot/` alone, and the Dockerfile's CMD is
      # `uvicorn api_bridge:app` — so the module the production image RUNS by
      # default was never statically analysed, nor was dashboard_api.py, nor
      # were the CI gate scripts that decide whether anything else ships.
      #
      # Extending it cost one annotation, not a backlog. Measured before
      # changing: at this scope bandit finds exactly one high/high issue, and
      # it is scripts/preflight.py's deliberate `shell=True` — see the `nosec`
      # there. api_bridge.py and dashboard_api.py are clean, which is the
      # useful half of this result: the value here is coverage from now on, not
      # a pile of findings to triage.
      - name: SAST — bandit (high severity, high confidence)
        run: bandit -r bot/ api_bridge.py dashboard_api.py scripts/ --severity-level high --confidence-level high -q

      - name: Tests — baseline-diff regression gate (+ coverage floor)
        run: python3 scripts/ci_test_gate.py

      # Ordered AFTER the test gate, and `always()`, so neither gate can hide
      # the other. A failed step skips the rest of the job by default, and
      # pip-audit used to sit directly above this suite — so three advisories
      # against a pinned transitive dependency meant 6,000 tests never ran and
      # the job reported "Lint + tests ❌" having executed neither the tests
      # nor anything after them. The reviewer reads that as a test failure. It
      # was the ABSENCE of a test result, which is a different thing, and
      # printing a subset's verdict as the whole run's is the defect this
      # repository spends most of its guard tests preventing.
      #
      # This changes ordering only. pip-audit still fails the job, so a real
      # advisory is not suppressed — it simply no longer costs the suite its
      # voice on the way past.
      - name: SCA — dependency vulnerability audit (pip-audit)
        if: always()
        run: pip-audit -r requirements.lock

  staking:
    name: Staking program (cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from rust-toolchain.toml so CI and a local build agree.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Runs tests/attack.rs in-process via solana-program-test. This is the
      # step that blocks a revert of the mint-scoped seeds at src/lib.rs, and
      # that pins the StakeAccount byte offsets bot/token/tier_gate.py reads.
      - name: Tests — staking program (incl. vault-drain + layout regressions)
        run: cargo test -p rclaw_staking --all-targets

      # A pinned build is the ONLY configuration intended to hold value, and it
      # used to exercise none of the vault logic: ten of eleven integration tests
      # self-skipped because they mint their own token, which the pin rejects.
      # The suite now materialises a mint AT the pinned address, so this run
      # covers the same vault paths. The address below is an arbitrary valid
      # pubkey — the point is that a pin is SET, not which one.
      - name: Tests — staking program under a PINNED build
        env:
          RCLAW_PINNED_MINT: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
        run: cargo test -p rclaw_staking --all-targets

      - name: Lint — clippy (deny warnings)
        run: cargo clippy -p rclaw_staking --all-targets -- -D warnings

      # Compiles under [profile.release], where overflow-checks = true applies.
      - name: Build — release profile
        run: cargo build -p rclaw_staking --release

      # The artifact that actually gets DEPLOYED, built for the first time.
      #
      # `cargo test` builds for the host. Solana runs SBF bytecode, and nothing
      # in this repo had ever produced any — the audit listed "no SBF build" as
      # an open caveat. When it was finally attempted it did not work, for a
      # reason no host build could surface: the toolchain pinned in Anchor.toml
      # (Solana 1.18.26) bundles cargo 1.75, and the dependency tree had drifted
      # into crates requiring `edition2024` and rustc 1.85+. The program could
      # not be built for deployment at all.
      #
      # Fixing that needed Cargo.lock pinned to lockfile v3 (cargo 1.75 cannot
      # parse v4) plus 19 transitive downgrades. Both are load-bearing and both
      # are easy to undo by accident — a single `cargo update` re-breaks
      # deployability while every host check stays green. Hence this gate.
      - name: Install the SBF toolchain (pinned to Anchor.toml's solana_version)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build — SBF bytecode (deployable artifact)
        run: |
          cargo-build-sbf --manifest-path programs/rclaw_staking/Cargo.toml
          ls -l target/deploy/rclaw_staking.so

      # PINNED_MINT is an option_env! read at lib.rs:75 — a build-time variable
      # that changes the deployed bytecode and gates the check stopping a user
      # staking a worthless token to buy a tier. Two ways that goes wrong
      # silently, both checked here by rebuilding rather than by reading source:
      #
      #   - if the build stops being reproducible, a published artifact hash
      #     becomes unverifiable, and an honest binary is indistinguishable from
      #     a substituted one;
      #   - if setting the variable stops changing the bytecode, the pin is not
      #     compiled in and every release is unpinned while the source still
      #     reads as though it works.
      #
      # ~15s on top of the build above, which has already installed the
      # toolchain. Rationale in full in the script's docstring.
      - name: Build provenance — reproducible, and the mint pin is compiled in
        run: python3 scripts/build_provenance_gate.py

      # SCA for the Rust side. Same reasoning as the npm gate in token-tooling:
      # Cargo.lock carries 8 RustSec advisories today, all inside the Solana 1.18
      # stack that rust-toolchain.toml and Anchor.toml pin ON PURPOSE so the
      # deployed bytecode is reproducible. Clearing them means a Solana major
      # bump, which is a deploy-gating decision — not something an unrelated PR
      # should be blocked on. So this ratchets: known advisories are recorded in
      # .cargo-audit-baseline.json and only NEW ones fail.
      #
      # The baseline also records whether each advisory is reachable through
      # non-dev dependencies. Six of the eight are test-harness only
      # (solana-program-test, RPC client); two are in the shipped tree.
      #
      # cargo-audit is installed rather than pulled from an action so the gate
      # logic lives in this repo and is testable locally. rust-cache keeps
      # ~/.cargo/bin across runs, so the compile cost is paid once.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: SCA — RustSec advisory ratchet
        run: python3 scripts/cargo_audit_gate.py

      # Is the guard REACHED? Three times in this audit a guard was written
      # correctly and some call site never received it: assertDevnet (5 of 9
      # presale commands), assertKeyfilePermissions (1 of 2 keypair loaders),
      # _token_gate_blocks (8 of 12 dispatch sites). A unit test cannot find
      # this — it exercises a path, and an UNGUARDED path is by definition one
      # nobody wrote a test for, so the suite stays green while half the call
      # sites are open. Pure source parsing, no deps, <1s.
      - name: Guard reachability (structural)
        run: python3 scripts/guard_lint.py

      - name: Check for the Anchor placeholder program id
        # `anchor keys sync` is mentioned only in a README snippet, so a build
        # can otherwise ship with a program id the project does not control.
        #
        # This is a PRE-DEPLOY gate, not a per-commit one. The placeholder is
        # expected on main today: no program has been deployed, so no real id
        # exists to sync to. Hard-failing unconditionally would make CI red by
        # construction until a deployment that cannot happen yet — so warn
        # normally, and fail only for a build that claims to be value-bearing.
        # RCLAW_PINNED_MINT is that claim: pinning a real mint while still
        # carrying a program id nobody controls is the actually-dangerous state.
        env:
          RCLAW_PINNED_MINT: ${{ vars.RCLAW_PINNED_MINT }}
        run: |
          if grep -q 'Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS' \
               programs/rclaw_staking/src/lib.rs Anchor.toml; then
            if [ -n "${RCLAW_PINNED_MINT}" ]; then
              echo "::error::Value-bearing build (RCLAW_PINNED_MINT is set) still carries the Anchor placeholder program id. Run 'anchor keys sync'."
              exit 1
            fi
            echo "::warning::Anchor placeholder program id is still present. Run 'anchor keys sync' before any deployment (docs/TOKEN_ROADMAP.md, 'Before any deployment holding value')."
          fi

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The workflow declares no permissions, so GITHUB_TOKEN arrives with the
    # repository default — contents only. gitleaks-action calls
    # GET /repos/{o}/{r}/pulls/{n}/commits to compute the PR's commit range and
    # died on `403 Resource not accessible by integration`, the response naming
    # `pull_requests=read` as what it wanted. Read-only, and scoped to this job
    # rather than the workflow, so no other job's token widens.
    #
    # This surfaced on the repo's FIRST pull request. The step is gated on
    # `github.event_name == 'pull_request'`, and every prior run was a push or
    # a workflow_dispatch — so the PR-scoped scan had never once executed. A
    # gate that has never run is not a gate that passes.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The action needs the PR's base commit to compute its diff range.
          fetch-depth: 0

      # .gitignore keeps key material out by pattern, but a pattern only helps
      # for paths someone thought of. This catches the ones nobody did — most
      # importantly a Solana keypair, which is a bare 64-byte JSON array and
      # looks nothing like a conventional API token.
      #
      # SCOPE: on a pull_request event this action scans only the PR's own
      # commits (it overrides the range to <head>^..<head>), NOT full history.
      # That is the right gate for "this PR introduces no secret". The
      # full-history scan below answers a different question and runs separately.
      #
      # Restricted to pull_request events, and that is a fix rather than a
      # narrowing. On any other event there is no PR to scope to, so the action
      # falls back to a bare `gitleaks detect` over all history — WITHOUT the
      # --baseline-path the step below uses. It therefore re-reports the single
      # triaged historical finding and fails, every time, on every manual re-run
      # and every push to main. Observed on run 30205745169: `event type:
      # workflow_dispatch`, then the dead BOT_SYNC_SECRET at 9435602.
      #
      # A step that is guaranteed red on a whole class of events carries no
      # signal and trains people to click past the scanner — the exact failure
      # the note below this one exists to avoid. Nothing is lost: the
      # full-history step runs unconditionally, with the baseline, so those
      # events are still scanned, and scanned correctly.
      #
      # Passing --baseline-path to the action instead would put a second copy of
      # the suppression in a second place. One fingerprint, one owner.
      - name: gitleaks (pull-request scope)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # A PR-scope scan answers "does this diff add a secret". It cannot answer
      # "is anything still reachable in this repository's history", which is the
      # question that actually matters for a public repo: a secret deleted in a
      # later commit is still fully readable to anyone who clones.
      #
      # This was deliberately not wired up until 2026-07-26. Before then a
      # history scan reported one REAL, unrotated credential (BOT_SYNC_SECRET,
      # hardcoded in app/server.js in commit 9435602, removed in f79518a), so
      # enabling it would have painted a live unremediated incident red on every
      # unrelated PR — which teaches everyone to click past the scanner. That
      # credential has since been rotated on both the bot and web sides and the
      # historical value is dead. Full note in .gitleaks.toml.
      #
      # The single triaged historical finding is suppressed by FINGERPRINT via
      # --baseline-path, not by a config allowlist, and that distinction is load
      # bearing: a fingerprint is commit:file:rule:line, so re-committing the
      # same dead value anywhere else still fails this step. A config allowlist
      # could not express that — it was tried, mutation-tested, and rejected.
      # The baseline is stored redacted, so it holds no secret itself.
      #
      # The binary is pinned and checksum-verified rather than installed from a
      # floating tag: this step is a supply-chain control, so it must not itself
      # execute an unverified download.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks git \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-history-baseline.json \
            --redact \
            --no-banner \
            .

  token-tooling:
    name: Token tooling (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: token/package-lock.json

      # `npm ci` honours the committed lockfile; `npm install` would silently
      # resolve caret ranges to new versions of packages that sign privileged
      # transactions.
      - name: Install (locked)
        working-directory: token
        run: npm ci --no-audit --no-fund

      - name: Parse — every script must at least compile
        working-directory: token
        run: |
          for f in scripts/*.mjs presale/*.mjs bridge/*.mjs e2e/*.mjs; do
            node --check "$f" || exit 1
          done

      # Glob rather than `--test presale/`: directory mode treats the directory
      # itself as a failing test unit on this Node version.
      #
      # scripts/*.test.mjs holds the cluster-identity guards. Its network cases
      # self-skip unless RUN_NETWORK_TESTS=1, so CI stays hermetic and does not
      # go red when a public RPC is rate-limiting; the offline case (a config
      # naming mainnet is refused before any network call) always runs.
      #
      # This glob also picks up presale/ata_idempotent.test.mjs, whose on-chain
      # half self-skips here because no validator is running yet. That is
      # intentional coverage of the skip path — the step below then runs the
      # same file against a validator and FAILS if anything skips.
      - name: Tests — offline unit tests
        working-directory: token
        run: node --test presale/*.test.mjs scripts/*.test.mjs

      # A local validator, so presale/ata_idempotent.test.mjs's on-chain half
      # actually RUNS here instead of self-skipping. A test that skips in CI is
      # a test that never runs, and this one covers the SPL Associated Token
      # program's dispatch on the CreateIdempotent discriminant — the exact
      # thing that cannot be verified by reading a client library, and the exact
      # thing mpl-toolbox got wrong.
      #
      # Fully hermetic: no --clone and no devnet. A bare validator ships SPL
      # Token and the ATA program built in. It notably does NOT ship MPL Token
      # Extras (TokExjvjJ…), the third-party program the deposit/trigger/claim
      # paths used to route through — which is how that dependency was found,
      # and is itself worth having wired into CI.
      - name: Install the Solana CLI (for solana-test-validator)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # nohup + setsid: each `run:` block is its own shell, and a bare `&` child
      # can take the SIGHUP when that shell exits. Detaching keeps the validator
      # alive for the step that actually uses it.
      - name: Start a local validator
        run: |
          setsid nohup solana-test-validator --reset --quiet --ledger /tmp/ci-ledger \
            >/tmp/validator.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then
              echo "validator up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "validator never became healthy"; tail -50 /tmp/validator.log; exit 1

      # Deliberately NOT `|| true`: the step above proved a validator is
      # reachable, so a skip here would mean the file decided to skip for some
      # other reason, which is exactly the failure this is guarding against.
      #
      # Bounded at 5 minutes: the whole file runs in ~5 SECONDS against a
      # healthy validator, so anything approaching this is a sick validator, and
      # it should say so rather than quietly consume the job's 20-minute budget
      # and take the SCA gates down with it. (The first attempt did exactly
      # that — umi's default `finalized` commitment, 32 slots a transaction.)
      - name: Tests — on-chain (local validator)
        working-directory: token
        timeout-minutes: 5
        env:
          RPC_URL: http://127.0.0.1:8899
        run: |
          out=$(node --test presale/ata_idempotent.test.mjs)
          echo "$out"
          if echo "$out" | grep -q '# SKIP'; then
            echo "::error::on-chain tests skipped despite a healthy validator"; exit 1
          fi

      # Fully offline: derives every on-chain parameter from config with no RPC
      # and no keypair, so a config that cannot produce a sane sale fails here.
      - name: Presale plan (offline derivation)
        working-directory: token
        run: npm run presale:plan

      # SCA — deliberately a RATCHET, not `npm audit --audit-level=high`.
      #
      # This tree carries 1 critical and 15 high advisories today, nearly all
      # transitive through the Wormhole SDK. A plain --audit-level=high gate
      # would be red on its first run and stay red on every unrelated PR, which
      # trains people to merge past a red check rather than fixing anything.
      # The known set is committed to token/.audit-baseline.json; this fails only
      # on an advisory id that is not in it, or a severity count above it — so a
      # newly-introduced vulnerable dependency blocks, and the pre-existing
      # backlog stays visible without gating.
      #
      # The backlog is real and unfixed. See docs/TOKEN_ROADMAP.md — it must be
      # cleared before any deployment that holds value, not merely baselined.
      - name: SCA — npm advisory ratchet
        working-directory: token
        run: node scripts/audit_gate.mjs

  rune-nft:
    name: Rune NFT (solidity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts/rune/package-lock.json

      - name: Install (locked)
        working-directory: contracts/rune
        run: npm ci --no-audit --no-fund

      # Compiles the real contract (solc) and runs the real bytecode on an
      # in-process EVM with real EIP-712 signatures. Hermetic: no network.
      - name: Contract tests (compile + EVM execution)
        working-directory: contracts/rune
        run: npm test

  web-app:
    name: Web app (express)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install (locked)
        working-directory: app
        run: npm ci --no-audit --no-fund

      # M3: app/ had TESTS in CI and nothing else — no SAST, no SCA, no lint on
      # the largest HTTP surface in the repo. These two are the cheap half of
      # closing that, and both were measured clean before being added, so
      # neither lands red.
      #
      # A syntax error in a route file does not fail the suite — the suite only
      # loads the modules its tests require, and 224 files here are not all
      # reachable that way. It fails at RUNTIME, on the first request to
      # whatever was never imported. Same gate the token job already runs, for
      # the same reason.
      - name: Parse — every script must at least compile
        working-directory: app
        run: |
          for f in *.js lib/*.js routes/*.js public/js/*.js; do
            [ -f "$f" ] || continue
            node --check "$f" || exit 1
          done

      # SCA — the SAME ratchet token/ uses, pointed at this tree, rather than a
      # second copy to drift against. app/ carries 1 low advisory today, so a
      # plain `npm audit --audit-level=high` would also pass — but it would
      # pass by luck, and go permanently red the day a transitive high lands
      # with no scheduled upgrade. The ratchet fails on what is NEW, which is
      # the thing anyone can actually act on.
      #
      # The root is a positional argument, not an env var: preflight.py runs
      # these steps by parsing the `run:` string and ignores `env:`, so an
      # env-var root would have this gate silently audit token/ when run
      # locally.
      - name: SCA — npm advisory ratchet
        working-directory: app
        run: node ../token/scripts/audit_gate.mjs .

      # app/ IS THE LARGEST HTTP SURFACE IN THIS REPO — 228 Express routes
      # against the aiohttp gateway's 53 — and until this job existed no
      # workflow referenced it at all. 1670 tests were written, committed, and
      # never executed by CI; app/test/allowances.test.js shipped in #926 and
      # had never run here. A test that does not run is documentation.
      #
      # Found while extending scripts/guard_lint.py to cover this surface: the
      # rule flagged routes/guardian.js as serving records with no auth, which
      # public_flight.js's own header described as "the authed" endpoint. That
      # is the class of defect the whole audit is about, and it was sitting in
      # a directory CI had never looked at.
      - name: Tests
        working-directory: app
        # The suite's TAP stream is ~350KB and the Actions log API serves only
        # the LAST ~344KB — so when an EARLY test fails, its `not ok` line and
        # error sit beyond reach of anything that reads logs programmatically.
        # PR #993 hit exactly this: "1929 pass / 1 fail" with the failing
        # test's NAME unreachable. Re-print failures at the end, where the
        # tail always lands. PIPESTATUS keeps the job's verdict from `npm
        # test` itself, not from tee/grep.
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "=== FAILING TESTS (re-printed so the log tail reaches them) ==="
            grep -n -A 25 "^not ok" test-output.log | tail -300
          fi
          exit $code
