# F-10 FIX: Pinned dependency versions, and the SUBJECT OF THE SCA GATE.
#
# `pip-audit` reads this file (.github/workflows/ci.yml, the "SCA" step).
# `make install`, the README, and the deploy docs install it too, with
# pip install -r requirements.lock
# The Dockerfile still installs
# `bot/requirements.txt` and names fastapi and uvicorn on that install line.
# CI installs `requirements-ci.txt`.
#
# This file stays a SUPERSET of what the image installs: every package the
# Dockerfile installs must appear here, or that package ships and is never
# audited. `tests/test_ci_executes_nothing_it_did_not_pin.py` pins that
# containment.
#
# NOT COVERED, stated rather than implied: the dev/test packages in
# `requirements-ci.txt` that are not here (pytest and friends, ruff, mypy,
# bandit, hypothesis, pip-audit, pyjwt) are installed in CI and audited by
# nothing. They do not ship.
#
# Regenerate from the image manifest, then re-audit:
#   pip install --upgrade -r bot/requirements.txt && pip freeze > requirements.lock
