# Workspace for RUNECLAW's on-chain (Solana/Anchor) programs. DRAFT / DEVNET.
# This is the repo's first Rust code — it builds independently of the Python bot
# and Node app, and only the $RCLAW staking program lives here for now.
[workspace]
resolver = "2"
members = ["programs/*"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
