[profile.default]
src = "src"
out = "out"
script = "script"
test = "test"
libs = []
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"

[profile.default.fuzz]
runs = 64

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"
avalanche_fuji = "${AVALANCHE_FUJI_RPC}"
