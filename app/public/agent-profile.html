<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agent — RUNECLAW</title>
<meta name="description" content="One agent's paper track record, forward-only and sealed at open, with the Merkle proof and Base anchor that let anyone check it without trusting us.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css?v=38">
<style>
  .ap-wrap { max-width: 760px; margin: 0 auto; padding: var(--s5) var(--s4); }
  .topnav { display: flex; gap: var(--s3); margin-bottom: var(--s4); font-size: var(--fs-sm); }
  .ap-block { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s3) var(--s4); margin-top: var(--s3); }
  .ap-block h3 { margin: 0 0 8px; font-size: var(--fs-sm); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .ap-name { font-family: var(--font-display); font-size: var(--fs-lg); margin: 0 0 4px; color: var(--gold-bright); }
  .ap-dim { color: var(--text-3); font-size: var(--fs-xs); line-height: 1.65; margin: 6px 0 0; }
  .ap-chain { font-family: var(--font-data); font-size: var(--fs-sm); margin: 10px 0 0; }
  /* Colour is a claim. Only `anchored` earns the profit colour; `not_in_root`
     earns the loss colour because it is a warning; everything else is muted. */
  .ap-up { color: var(--up); }
  .ap-down { color: var(--down); font-weight: 600; }
  .ap-flat { color: var(--text-3); }
  .ap-tx { font-family: var(--font-data); font-size: var(--fs-xs); word-break: break-all; }
  .ap-stats { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .ap-stats li { display: flex; flex-direction: column; gap: 2px; }
  .ap-stats span { color: var(--text-3); font-size: var(--fs-xs); }
  .ap-stats b { font-family: var(--font-data); font-size: var(--fs-md); }
  .ap-warn { color: var(--text-2); font-size: var(--fs-xs); margin: 10px 0 0; }
  .ap-err { border-color: var(--down); }
  .ap-err h3 { color: var(--down); }
  .ap-payload { white-space: pre-wrap; word-break: break-all; font-family: var(--font-data); font-size: var(--fs-xs); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; }
  .ap-proof summary { cursor: pointer; font-size: var(--fs-xs); color: var(--text-2); margin-top: 10px; }
  .ap-limits { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }
  .ap-foot { color: var(--text-3); font-size: var(--fs-xs); border-top: 1px solid var(--line); margin-top: var(--s5); padding-top: var(--s3); }
</style>
</head>
<body>
<div class="ap-wrap" role="main">
  <nav class="topnav"><a href="/">← RUNECLAW</a><span style="flex:1"></span><a href="/provable">Verify it yourself</a><a href="/roots">Seal roots</a><a href="/arena">The Arena</a></nav>
  <h1 id="apTitle" style="font-family:var(--font-display);letter-spacing:.03em">Agent</h1>
  <div id="apBody"><p class="ap-dim">Loading…</p></div>
</div>

<script src="/js/agent-page.js?v=1"></script>
<script>
(function () {
  'use strict';
  var V = window.RCAgentPage;
  var slug = (location.pathname.split('/').filter(Boolean)[1] || '').toLowerCase();
  var body = document.getElementById('apBody');

  // OMIT, per source. Each fetch resolves to `{ ok, data }` or `{ ok: false }`
  // and NEVER throws onward, so one dead endpoint cannot blank the other
  // block. What it must not become is silence: a failed source renders
  // errorHtml IN ITS OWN PLACE, because an omitted block that says nothing
  // reads exactly like a block with nothing to say.
  function read(url) {
    return fetch(url, { headers: { accept: 'application/json' } })
      .then(function (r) {
        if (r.status === 404) return { ok: true, missing: true };
        if (!r.ok) return { ok: false };
        return r.json().then(function (d) { return { ok: true, data: d }; });
      })
      .catch(function () { return { ok: false }; });
  }

  if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(slug)) {
    body.innerHTML = '<div class="ap-block ap-err"><h3>No agent named</h3>'
      + '<p>This URL does not carry a valid agent slug.</p></div>';
    return;
  }
  document.title = slug + ' — RUNECLAW';

  Promise.all([
    read('/api/public/agent-identity/' + encodeURIComponent(slug)),
    read('/api/public/agent-record/' + encodeURIComponent(slug)),
  ]).then(function (res) {
    var ident = res[0], rec = res[1];
    var html = '';

    if (ident.ok && ident.missing) {
      body.innerHTML = '<div class="ap-block"><h3>No such agent</h3>'
        + '<p class="ap-dim">Nobody has claimed <code>' + V.esc(slug) + '</code>.</p></div>';
      return;
    }
    if (ident.ok && ident.data) {
      document.getElementById('apTitle').textContent = ident.data.display_name || slug;
      html += V.identityHtml(ident.data);
    } else {
      html += V.errorHtml('Identity', 'The claim and its chain could not be read.');
    }

    if (rec.ok && rec.data) {
      html += V.recordHtml(rec.data) + V.ownHtml(rec.data.own);
    } else if (rec.ok && rec.missing) {
      // A 404 on the record is a real answer, not a fault: no attributed
      // trades exist for this slug yet.
      html += V.recordHtml({ trades: 0, copiers: 0 }) + V.ownHtml(null);
    } else {
      html += V.errorHtml('Track record', 'The trade record could not be read.');
    }

    body.innerHTML = html + V.footerHtml();
  });
}());
</script>
</body>
</html>
