<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Per-agent <title>, description, canonical, Open Graph, Twitter card and
     JSON-LD are injected server-side by the /agents/:slug route (lib/agent_seo.js),
     so each strategy agent unfurls + ranks with its own identity. This marker is
     replaced with the generic directory card when the catalogue is unavailable. -->
<!--AGENT_SEO-->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0a0b10">
<link rel="stylesheet" href="/styles.css?v=50">
<style>
  /* Page-local composition only — tokens/components come from styles.css */
  .sa-wrap { max-width: 760px; margin: 0 auto; padding: var(--s5) var(--s4) var(--s6); }
  .topnav { display: flex; gap: var(--s3); align-items: center; margin-bottom: var(--s4); flex-wrap: wrap; }
  .topnav a { color: var(--text-2); font-size: var(--fs-sm); }
  .topnav a:hover { color: var(--text-1); }
  .spacer { flex: 1; }
  .sa-card { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold-bright); border-radius: var(--radius); padding: var(--s5); margin-bottom: var(--s4); }
  .sa-head { display: flex; gap: var(--s3); align-items: center; }
  .sa-head .icon-emoji { font-size: 40px; line-height: 1; }
  .sa-head h1 { font-family: var(--font-display); letter-spacing: .04em; font-size: clamp(24px, 4vw, 34px); margin: 0; }
  .tagline { color: var(--text-2); margin: var(--s2) 0 0; }
  .how { color: var(--text-2); font-size: var(--fs-sm); margin: var(--s3) 0 0; }
  .how b { color: var(--text-1); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: var(--s3) 0 0; }
  .chip { display: inline-flex; align-items: center; font-size: var(--fs-xs); padding: 3px 10px; border-radius: 999px; font-family: var(--font-data); background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line-2); }
  .sc { border-top: 1px solid var(--line); margin-top: var(--s4); padding-top: var(--s4); }
  .sc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2) var(--s3); align-items: start; }
  .sc-tile { min-width: 0; }
  .sc-tile .k { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-3); }
  .sc-tile .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: var(--fs-lg); font-weight: 600; white-space: nowrap; }
  .v.up { color: var(--up); } .v.down { color: var(--down); }
  .prov { font-size: 10px; color: var(--text-3); margin: var(--s2) 0 0; }
  .lowchip { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--warn-dim); color: var(--warn); margin-top: 6px; }
  .cta-row { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s4); }
  .disc { color: var(--text-3); font-size: var(--fs-xs); line-height: 1.6; margin-top: var(--s4); }
  .empty { text-align: center; color: var(--text-3); padding: var(--s6) var(--s4); }
</style>
</head>
<body>
<div class="sa-wrap" role="main">
  <nav class="topnav">
    <a href="/" data-i18n="nav.back_runeclaw">← RUNECLAW</a>
    <span class="spacer"></span>
    <a href="/agents" data-i18n="st.all_agents">All agents</a>
    <a href="/leaderboard" data-i18n="vh.leaderboard.title">Leaderboard</a>
    <a href="/proof" data-i18n="nav.proof">Proof of PnL</a>
  </nav>

  <div id="sa-root"><div class="empty" data-i18n="st.loading">Loading strategy agent…</div></div>
</div>

<script src="/js/agent-scorecard.js?v=5"></script>
<script>
(function () {
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  // Same contract as app.js pnlClass, in this page's up/down tokens. This
  // page does not load app.js. Empty string and NaN are unreadable, not 0 —
  // Number('') is 0, and 0 would paint a missing ratio green.
  var cls = function (v) {
    if (v == null || (typeof v === 'string' && String(v).trim() === '')) return '';
    var n = Number(v);
    if (!isFinite(n)) return '';
    return n >= 0 ? 'up' : 'down';
  };
  var root = document.getElementById('sa-root');

  // Slug is the last path segment of /agents/<slug>.
  var parts = location.pathname.split('/').filter(Boolean);
  var slug = decodeURIComponent(parts[parts.length - 1] || '').toLowerCase();
  if (slug === 'agents' || !/^[a-z0-9][a-z0-9-]{0,63}$/.test(slug)) {
    root.innerHTML = '<div class="empty">Pick an agent from the <a href="/dashboard#agents">catalogue</a>.</div>';
    return;
  }

  // Community strategies are configs (intent rules), not backtests — render the
  // rules instead of a scorecard.
  var RULE_LABEL = {
    max_position_pct: 'Max size/trade', max_symbol_exposure_pct: 'Max per-symbol',
    max_portfolio_exposure_pct: 'Max portfolio', max_open_positions: 'Max open',
    min_confidence: 'Min confidence', min_rr: 'Min R:R', max_daily_loss_pct: 'Max daily loss',
    max_drawdown_pct: 'Max drawdown', min_free_margin_pct: 'Min free margin',
    allowed_symbols: 'Only', blocked_symbols: 'Never', allowed_strategy_types: 'Only strategies',
    direction: 'Direction',
  };
  function ruleVal(r) {
    var v = r.value;
    if (Array.isArray(v)) return v.join(', ');
    if (r.type === 'min_confidence') return Math.round(Number(v) * 100) + '%';
    if (/pct$/.test(r.type)) return v + '%';
    if (r.type === 'min_rr') return v + 'R';
    if (r.type === 'direction') return String(v).replace('_', ' ');
    return String(v);
  }
  var T = function (k, en) {
    try { return (window.RCI18N && RCI18N.translate(k, RCI18N.getLang())) || en; }
    catch (e) { return en; }
  };
  function profileLine(p) {
    if (!p || !p.facts || !p.facts.length) return '';
    var fillT = function (tpl, map) { return String(tpl).replace(/\{(\w+)\}/g, function (_, k) { return map[k] != null ? map[k] : '{' + k + '}'; }); };
    var facts = p.facts.map(function (f) { return fillT(T('sp.f_' + f.id, f.en), f.params || {}); }).join(' · ');
    return '<div style="font-size:12px;color:var(--text-2);margin-bottom:8px" title="' + esc(T('sp.cv', 'a shape read of the config — not a safety verdict')) + '">'
      + '<span class="chip">' + esc(T('sp.h', 'Declared constraints')) + ': <b>' + esc(T('sp.tier_' + p.tier, p.tier)) + '</b></span> ' + esc(facts) + '</div>';
  }
  function rulesBlock(rules, prof) {
    if (!rules || !rules.length) return '';
    var chips = rules.map(function (r) {
      return '<span class="chip"><span style="color:var(--text-3)">' + esc(RULE_LABEL[r.type] || r.type)
        + '</span>&nbsp;<b>' + esc(ruleVal(r)) + '</b></span>';
    }).join('');
    return '<div class="sc"><div class="k" style="font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-3);margin-bottom:8px">Strategy rules</div>'
      + profileLine(prof)
      + '<div class="chips" style="margin:0">' + chips + '</div>'
      + '<p class="prov">A member-authored config — intent rules, not a verified backtest. No dollar figures, no performance claims.</p></div>';
  }

  // ── strategy scorecard renderer ──
  function scoreBlock(sc) {
    if (sc && typeof sc.omitted === 'string' && sc.omitted) {
      return '<div class="sc"><p class="prov">' + esc(sc.omitted) + '</p></div>';
    }
    if (!sc || !sc.metrics) {
      return '<div class="sc"><p class="prov">No track record published.</p></div>';
    }
    if (!window.AgentScorecard) {
      return '<div class="sc"><p class="prov">The scorecard could not be painted.'
        + ' This is not a pending backtest.</p></div>';
    }
    // `cls` is this page's colour helper (up/down). The shared reading only
    // chooses which number it sees; it does not invent a second palette.
    var read = window.AgentScorecard.readings(sc.metrics, cls);
    var grid = read.cells.map(function (c) {
      return '<div class="sc-tile" data-metric="' + esc(c.key) + '"><div class="k">' + esc(c.label) + '</div>'
        + '<div class="v ' + (c.cls || '') + '" data-metric-value>' + esc(c.text) + '</div></div>';
    }).join('');
    var low = read.lowSample !== null
      ? '<div class="lowchip">low sample · ' + read.lowSample + ' trades</div>' : '';
    var prov = 'Frozen backtest · ' + esc(sc.dataset || '') + ' · ' + (sc.bars || '?') + ' bars'
      + (sc.dataset_hash ? ' · #' + esc(sc.dataset_hash) : '');
    var folds = window.AgentScorecard.foldHtml(sc.folds);
    var mark = window.AgentScorecard.discoveryHtml(sc.data_mark);
    return '<div class="sc"><div class="sc-grid">' + grid + '</div>' + low
      + '<p class="prov">' + prov + '</p>'
      + '<p class="prov">' + folds + ' ' + mark + '</p></div>';
  }
  // ── strategy scorecard renderer end ──

  // ── Live paper record — forward-only, sealed-at-open, copiers' record ──
  function fillT(tpl, map) {
    return String(tpl).replace(/\{(\w+)\}/g, function (_, k) { return map[k] != null ? map[k] : '{' + k + '}'; });
  }
  function recRow(t) {
    var up = String(t.direction || '').toUpperCase() === 'LONG';
    var rom = t.rom_pct == null ? '—' : (t.rom_pct > 0 ? '+' : '') + t.rom_pct + '%';
    return '<div class="rec-row" style="display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgba(128,128,128,.12);font-size:13px">'
      + '<b>' + esc(String(t.symbol || '').replace(/USDT$/, '')) + '</b>'
      + '<span class="chip" style="font-size:10px">' + (up ? 'LONG' : 'SHORT') + '</span>'
      + '<span style="color:' + (t.rom_pct > 0 ? 'var(--up)' : t.rom_pct < 0 ? 'var(--down)' : 'var(--text-3)') + '">' + esc(rom) + '</span>'
      + '<span class="muted" style="font-size:11px">' + esc(t.reason || '') + '</span>'
      + (t.trade_key ? '<a href="/call/' + encodeURIComponent(t.trade_key) + '" style="margin-left:auto;font-size:11px">'
        + esc(T('rec.verify', 'verify')) + ' ↗</a>' : '')
      + '</div>';
  }
  function renderRecord(r) {
    var host = document.getElementById('liveRecord');
    if (!host || !r || !r.trades) return;   // no record → no section, no claim
    var cells = [
      [r.trades, T('rec.trades', 'copied trades')],
      [r.copiers, T('rec.copiers', 'copiers')],
      [r.wins + '/' + r.losses, T('rec.wl', 'wins / losses')],
      [(r.median_rom_pct > 0 ? '+' : '') + r.median_rom_pct + '%', T('rec.median', 'median return on margin')],
      [r.worst_rom_pct + '% … ' + (r.best_rom_pct > 0 ? '+' : '') + r.best_rom_pct + '%', T('rec.spread', 'worst … best')],
    ].map(function (c) {
      return '<div><div style="font-family:var(--font-data);font-size:16px">' + esc(String(c[0])) + '</div>'
        + '<div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.04em">' + esc(c[1]) + '</div></div>';
    }).join('');
    host.innerHTML = '<div class="sc" style="margin-top:14px">'
      + '<div class="k" style="font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-3);margin-bottom:8px">'
      + esc(T('rec.h', 'Live paper record')) + (r.open_now ? ' · ' + esc(fillT(T('rec.open_now', '{n} open now'), { n: r.open_now })) : '') + '</div>'
      + '<div style="display:flex;gap:18px;flex-wrap:wrap">' + cells + '</div>'
      + (r.low_sample ? '<p class="muted" style="font-size:11px;margin:8px 0 0">⚠ ' + esc(fillT(T('rec.low', 'Low sample — {n} trades prove very little.'), { n: r.trades })) + '</p>' : '')
      + '<div style="margin-top:8px">' + (r.recent || []).map(recRow).join('') + '</div>'
      + '<p class="prov">' + esc(T('rec.note', "Forward-only record of members paper-copying this agent's picks — every row was sealed when it opened, before its outcome existed. Fills are live marks, never the call's price. This is the copiers' record, not the engine's; virtual funds only.")) + '</p>'
      + '</div>';
  }
  function loadRecord(slug) {
    fetch('/api/public/agent-record/' + encodeURIComponent(slug), { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(renderRecord)
      .catch(function () { /* no record read → no section — omit, never invent */ });
  }
  function render(a) {
    var chips = [a.risk_label, a.regime, a.horizon].filter(Boolean)
      .map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('');
    document.title = 'RUNECLAW — ' + a.name;
    root.innerHTML = '<article class="sa-card">'
      + '<div class="sa-head"><span class="icon-emoji">' + esc(a.icon || '🤖') + '</span>'
      + '<div><h1>' + esc(a.name) + '</h1>'
      + (a.tagline ? '<p class="tagline">' + esc(a.tagline) + '</p>' : '') + '</div></div>'
      + (a.how ? '<p class="how"><b>How it trades:</b> ' + esc(a.how) + '</p>' : '')
      + (chips ? '<div class="chips">' + chips + '</div>' : '')
      + (a.community ? rulesBlock(a.rules, a.risk_profile) : scoreBlock(a.scorecard))
      + '<div id="liveRecord"></div>'
      + '<div class="cta-row">'
      + (a.community
        // A member config — no frozen backtest to reproduce. Fork it into your
        // own builder to customize and publish your version.
        ? '<a class="btn btn--primary btn--sm" href="/dashboard?fork=' + encodeURIComponent(a.id) + '#agents">⑂ Fork in the app</a>'
        // A preset whose exits are recorded and not applied has no backtest
        // to reproduce. The Lab door would claim a track record that is missing.
        : (a.scorecard && a.scorecard.metrics
          // Deep-link straight into the Lab with THIS agent auto-running its exact
          // backtest — only when a frozen run exists to reproduce.
          ? '<a class="btn btn--primary btn--sm" href="/dashboard?lab_agent=' + encodeURIComponent(a.id) + '#lab">Reproduce this backtest in the Lab</a>'
            + (window.AgentScorecard ? window.AgentScorecard.followLinkHtml(a) : '')
          : (window.AgentScorecard ? window.AgentScorecard.followLinkHtml(a) : '')))
      + '<button class="btn btn--sm" id="shareBtn" type="button">Share</button>'
      + '</div>'
      + '<p class="disc">' + (a.community
        ? 'A community strategy is a member-authored <b>config</b> — intent rules and a description, '
          + 'never a dollar figure and never a performance claim. Verified backtests live in the '
          + '<a href="/dashboard#lab">Lab</a>; verified live ranks on the <a href="/leaderboard">leaderboard</a>. '
          + 'Nothing here is financial advice.'
        : (a.scorecard && a.scorecard.omitted
          ? esc(a.scorecard.omitted) + ' Nothing here is financial advice.'
          : (a.scorecard && a.scorecard.metrics
            ? 'This agent\'s backtest ran on frozen, content-hashed benchmark data — '
              + 'percent and ratio only, never a dollar figure. '
              + 'Reproduce the identical backtest yourself in the Lab, or watch verified live ranks on the '
              + '<a href="/leaderboard">leaderboard</a>. Nothing here is financial advice.'
            : 'No track record published. Nothing here is financial advice.'))) + '</p>'
      + '</article>';
    var sb = document.getElementById('shareBtn');
    if (sb) sb.addEventListener('click', function () {
      var url = location.href;
      var data = { title: 'RUNECLAW — ' + a.name, text: a.tagline || a.name, url: url };
      if (navigator.share) { navigator.share(data).catch(function () {}); }
      else if (navigator.clipboard) { navigator.clipboard.writeText(url).then(function () {
        sb.textContent = 'Link copied'; setTimeout(function () { sb.textContent = 'Share'; }, 1500);
      }).catch(function () {}); }
    });
  }

  function notFound() {
    root.innerHTML = '<div class="empty">No strategy named “' + esc(slug) + '”. '
      + 'See the <a href="/dashboard#agents">full catalogue</a>.</div>';
  }
  // Try the engine catalogue first, then fall back to a published community
  // strategy — the same slug space serves both.
  function unavailable() {
    root.innerHTML = '<div class="empty">The catalogue is unavailable right now. '
      + 'Try the <a href="/dashboard#agents">app</a>.</div>';
  }
  // "No strategy named X" is a claim about the catalogue's CONTENTS, and a
  // failed read is no evidence for it. Only a 404 — the server answering that
  // this slug is not there — earns notFound(); every other failure says so.
  // Someone opening a shared strategy link during an outage should not be told
  // their strategy does not exist.
  // The two catalogues are INDEPENDENT sources: an engine-gateway outage is
  // no reason to break a shared community link. So an engine-read failure
  // still tries the community endpoint — but it forfeits the right to say
  // notFound (the slug might live in the catalogue we could not read).
  function tryCommunity(engineReadable) {
    fetch('/api/public/user-strategies/' + encodeURIComponent(slug), { headers: { Accept: 'application/json' } })
      .then(function (r) {
        if (r.status === 404) return null;              // genuinely not there
        if (!r.ok) throw new Error('HTTP ' + r.status);  // we could not look
        return r.json();
      })
      .then(function (cd) {
        if (cd && cd.agent) { render(cd.agent); loadRecord(slug); }
        else if (engineReadable) notFound();             // both sources answered: absent
        else unavailable();                              // engine unread — no absence claim
      })
      .catch(unavailable);
  }
  fetch('/api/public/strategies', { headers: { Accept: 'application/json' } })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      var agents = (d && d.agents) || [];
      var a = agents.filter(function (x) { return String(x.id).toLowerCase() === slug; })[0];
      if (a) { render(a); loadRecord(slug); return; }
      tryCommunity(true);
    })
    .catch(function () { tryCommunity(false); });
})();
</script>
<script src="/js/i18n-core.js?v=164"></script>
<script src="/js/palette.js?v=1" defer></script>
</body>
</html>
