<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RUNECLAW — Time to cash</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css?v=52">
<style>
  .t2c-wrap { max-width: 820px; margin: 0 auto; padding: var(--s5) var(--s4) var(--s6); }
  .t2c-wrap h1 { font-family: var(--font-display); letter-spacing: .04em; font-size: clamp(26px, 4vw, 40px); margin: 0 0 var(--s2); }
  .lede, .note { color: var(--text-2); max-width: 68ch; line-height: 1.6; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s4); margin: var(--s4) 0; }
  .row { display: grid; grid-template-columns: 12rem 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .k { color: var(--text-3); font-size: var(--fs-sm); }
  .tone-muted { color: var(--text-3); }
  .v { font-family: var(--font-data); font-size: var(--fs-sm); }
  h2 { font-size: var(--fs-md); margin: 0 0 var(--s2); }
</style>
<script src="/js/api-retry.js?v=3"></script>
</head>
<body>
<div class="t2c-wrap" role="main">
  <nav class="topnav" style="display:flex;gap:var(--s3);margin-bottom:var(--s4)">
    <a href="/">← RUNECLAW</a>
  </nav>
  <h1>Time to cash</h1>
  <p class="lede">A cap and LTV signal for how long an exit takes. It is not a liquidation price. Unread fields stay unread.</p>
  <div id="t2c-out" aria-live="polite"><p class="tone-muted">Loading the signal.</p></div>
</div>
<script src="/js/t2c.js?v=1"></script>
</body>
</html>
